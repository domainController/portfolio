<body>
  <div class="container">
    <div class="meta-bar">
      <div class="meta-left">
        <a class="home-icon" href="../../index.html" title="Home">&#8962;</a>

        <a class="nav-back" href="index.html">Clusters</a>

    <h1>Traction Development</h1>
    <div class="branch-desc">Updated as progress happens.</div>
    <div class="frontmatter">
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">stage</span></div><div class="fm-value">Landing page <span class="status-tag status-live">live</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">repo</span></div><div class="fm-value"><a class="link-external" href="https://github.com/domainController/clusters-website">domainController/clusters-website</a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">launch</span></div><div class="fm-value"><span id="launch">—</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">uptime</span></div><div class="fm-value"><span id="uptime">—</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">deployment</span></div><div class="fm-value"><a href="commits/index.html" id="commit-chart" style="display:flex;justify-content:flex-start;text-decoration:none;"></a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">audience</span></div><div class="fm-value"><a class="link-external" href="https://cluster.goatcounter.com">cluster.goatcounter.com</a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">next milestone</span></div><div class="fm-value">Align visual identity with auditum-memoria.com (pending its CSS)</div></div>
    </div>
  </div>
<script>
(function () {
  var origFetch = window.fetch;
  window.fetch = function (url) {
    if (typeof url === 'string' && url.indexOf('api.github.com/repos/') !== -1) {
      var cacheKey = 'ghcache_' + url;
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(cacheKey)); } catch (e) {}
      var now = Date.now();
      if (cached && (now - cached.t) < 15 * 60 * 1000) {
        return Promise.resolve({ json: function () { return Promise.resolve(cached.d); } });
      }
      return origFetch.apply(this, arguments).then(function (r) {
        return r.json().then(function (data) {
          if (data && !data.message) {
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: now, d: data })); } catch (e) {}
          } else if (cached) {
            data = cached.d;
          }
          return { json: function () { return Promise.resolve(data); } };
        });
      }).catch(function () {
        if (cached) return { json: function () { return Promise.resolve(cached.d); } };
        return { json: function () { return Promise.resolve([]); } };
      });
    }
    return origFetch.apply(this, arguments);
  };
})();
</script>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'marketplace/clusters/traction.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
<script>
(function () {
  var repo = 'domainController/clusters-website';
  fetch('https://api.github.com/repos/' + repo + '/commits?per_page=100')
    .then(function (r) { return r.json(); })
    .then(function (commits) {
      if (!commits || !commits.length || commits.message) return;
      commits.reverse();

      var first = new Date(commits[0].commit.committer.date);
      var launchEl = document.getElementById('launch');
      if (launchEl) {
        var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' };
        launchEl.textContent = first.toLocaleString('en-US', opts) + ' UTC';
      }

      function fmtUptime(ms) {
        var totalDays = Math.floor(ms / 86400000);
        var hours = Math.floor((ms % 86400000) / 3600000);
        if (totalDays < 1) return hours + (hours === 1 ? ' hour' : ' hours');
        if (totalDays < 7) {
          return totalDays + (totalDays === 1 ? ' day' : ' days') + ', ' + hours + (hours === 1 ? ' hour' : ' hours');
        }
        var years = Math.floor(totalDays / 365);
        var remAfterYears = totalDays % 365;
        var months = Math.floor(remAfterYears / 30);
        var remAfterMonths = remAfterYears % 30;
        var weeks = Math.floor(remAfterMonths / 7);
        var days = remAfterMonths % 7;
        var parts = [];
        if (years > 0) parts.push(years + (years === 1 ? ' year' : ' years'));
        if (months > 0) parts.push(months + (months === 1 ? ' month' : ' months'));
        if (weeks > 0) parts.push(weeks + (weeks === 1 ? ' week' : ' weeks'));
        if (years === 0 && months === 0) {
          if (days > 0 || parts.length === 0) parts.push(days + (days === 1 ? ' day' : ' days'));
        }
        return parts.join(', ') + ' (' + totalDays + 'd total)';
      }

      var uptimeEl = document.getElementById('uptime');
      function tickUptime() {
        if (!uptimeEl) return;
        var now = new Date();
        uptimeEl.textContent = fmtUptime(now - first);
      }
      tickUptime();
      setInterval(tickUptime, 60000);

      var counts = {};
      commits.forEach(function (c) {
        var d = new Date(c.commit.committer.date);
        var key = d.toISOString().slice(0, 10);
        counts[key] = (counts[key] || 0) + 1;
      });
      var dayKeys = Object.keys(counts).sort();
      var maxVal = Math.max.apply(null, dayKeys.map(function (k) { return counts[k]; }));
      var w = 190, h = 44, pad = 8, leftPad = 14;
      var step = dayKeys.length > 1 ? (w - leftPad - pad) / (dayKeys.length - 1) : 0;
      var pts = dayKeys.map(function (k, i) {
        var x = leftPad + i * step;
        var y = h - pad - (counts[k] / maxVal) * (h - 2 * pad);
        return [x, y, counts[k], k];
      });

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      [0, 0.5, 1].forEach(function (frac) {
        var y = pad + (h - 2 * pad) * (1 - frac);
        var gline = document.createElementNS(svgNS, 'line');
        gline.setAttribute('x1', leftPad); gline.setAttribute('x2', w);
        gline.setAttribute('y1', y); gline.setAttribute('y2', y);
        gline.setAttribute('stroke', '#1e2340'); gline.setAttribute('stroke-width', '1');
        svg.appendChild(gline);
        var glabel = document.createElementNS(svgNS, 'text');
        glabel.setAttribute('x', 0); glabel.setAttribute('y', y + 2);
        glabel.setAttribute('font-family', "'SF Mono', Consolas, monospace");
        glabel.setAttribute('font-size', '6'); glabel.setAttribute('fill', '#5a6080');
        glabel.textContent = Math.round(frac * maxVal);
        svg.appendChild(glabel);
      });

      var poly = document.createElementNS(svgNS, 'polyline');
      poly.setAttribute('points', pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' '));
      poly.setAttribute('fill', 'none'); poly.setAttribute('stroke', '#6bb3f0'); poly.setAttribute('stroke-width', '1.5');
      svg.appendChild(poly);
      pts.forEach(function (p) {
        var t = document.createElementNS(svgNS, 'text');
        t.setAttribute('x', p[0]); t.setAttribute('y', h - 1);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-family', "'SF Mono', Consolas, monospace");
        t.setAttribute('font-size', '6'); t.setAttribute('fill', '#5a6080');
        t.textContent = p[3].slice(8, 10);
        svg.appendChild(t);
      });
      var container = document.getElementById('commit-chart');
      if (container) container.appendChild(svg);
    })
    .catch(function () { });
})();
</script>
</body>
