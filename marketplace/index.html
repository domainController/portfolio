<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Managed Marketplaces — Patrice Kenmoé</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">

    <div class="meta-bar">
      <div class="meta-left">
        <span class="category">Portfolio</span>
        <span class="sep">·</span>
        <span>Version 0.1.0</span>
        <span class="sep">·</span>
        <span id="last-updated">Updated —</span>
      </div>
    </div>

    <h1>Managed Marketplaces</h1>
    <div class="branch-desc">Marketplaces that manage the transaction, not just the listing.</div>

    <div class="children">
      <div class="child"><a href="https://clusters.homes">Clusters</a> <span class="status-tag status-draft">draft</span><div class="child-desc"><a href="clusters/index.html">Managed marketplace for distributed foyers.</a></div></div>
      <div class="child"><a href="https://curb.exchange">Curb</a> <span class="status-tag status-draft">draft</span><div class="child-desc"><a href="curb/index.html">Managed intermediation marketplace for secondhand goods.</a></div></div>
    </div>

    <a class="back-link" href="../index.html">← Back to Patrice Kenmoé</a>

  </div>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'marketplace/index.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
</body>
</html>
