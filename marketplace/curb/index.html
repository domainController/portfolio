<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curb — Traction</title>
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">

    <div class="meta-bar">
      <div class="meta-left">
        <a class="home-icon" href="../../index.html" title="Home">&#8962;</a>
        <span class="sep">·</span>
        <a class="nav-back" href="../index.html">Managed Marketplaces</a>
        <span class="sep">·</span>
        <span>Version 0.1.0</span>
        <span class="sep">·</span>
        <span id="last-updated">Updated —</span>
      </div>
    </div>

    <h1>Curb</h1>
    <div class="branch-desc">Traction development — updated as progress happens.</div>

    <div class="frontmatter">
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">stage</span></div><div class="fm-value">Landing page <span class="status-tag status-live">live</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">first online</span></div><div class="fm-value">[à dater]</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">uptime</span></div><div class="fm-value">[à calculer une fois daté]</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">next milestone</span></div><div class="fm-value">Ship a working CTA / waitlist</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">repo</span></div><div class="fm-value">[à préciser]</div></div>
    </div>
</div>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'marketplace/curb/index.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
</body>
</html>
