<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'startups/index.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
