<body>
  <div class="container attr-page">

        <span class="sep">·</span>
        <a class="nav-back" href="index.html">Vetnups</a>
        <span class="sep">·</span>
        <span id="last-updated">Updated —</span>
      </div>
      <div class="meta-right lang-switch">

        <a class="active" href="product.html">Product</a>

    <h1>Vetnups</h1>
    <div class="branch-desc">Build, infrastructure, focus.</div>

    <div class="frontmatter">
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">website</span></div><div class="fm-value"><a class="link-external" href="https://vetnups.com">vetnups.com</a> <span class="status-tag status-live">live</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">traction</span></div><div class="fm-value"><a class="link-live" href="traction.html">Landing page</a> <span class="status-tag status-live">live</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">cold start</span></div><div class="fm-value">2/10 — vetting bottleneck, not regulation</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">deploy priority</span></div><div class="fm-value">8/10 — among the fastest to revenue</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">focus</span></div><div class="fm-value">Sequencing (1st, ~30% of work time) <span class="status-tag status-live">active</span></div></div>
    </div>

  </div>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'startups/vetnups/product.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
</body>
</html>
