  <div class="container attr-page">

        <span class="sep">·</span>
        <a class="nav-back" href="index.html">Vetnups</a>

    <h1>Vetnups</h1>
    <div class="branch-desc">The four transversal labs.</div>

    <div class="frontmatter">
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">legal lab</span></div><div class="fm-value"><a class="link-external" href="#">ClauseWorks</a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">engineering lab</span></div><div class="fm-value"><a class="link-external" href="#">labs.vetnups.com</a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">market lab</span></div><div class="fm-value"><a class="link-external" href="#">Market Notes</a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">finance lab</span></div><div class="fm-value"><a class="link-external" href="https://narrativeconstructs.com/economic-anthropology/deterministic-ventures/index.html">Deterministic Ventures</a></div></div>
    </div>

  </div>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'startups/vetnups/labs.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
</body>
</html>
