<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benchmarks — Ventures &amp; Comparisons</title>
<style>
  /* Palette recopiée depuis css/style.css (le thème du site) plutôt qu'importée,
     pour que cette page reste autonome (aucune dépendance externe, CSS inline). */
  :root {
    --bg: #0a0e27; --panel: #161a33; --border: #232849; --text: #fff;
    --muted: #8a90a8; --key: #7a8296; --accent: #4a90e2; --accent-soft: rgba(74,144,226,0.15);
    --green: #6bcf7f; --green-soft: rgba(107,207,127,0.15);
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); }
  a:hover { color: #6bb3f0; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); padding: 28px 16px 80px; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .mode-switcher { display: flex; gap: 8px; }
  .mode-switcher button { font-family: var(--sans); font-size: 14px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer; }
  .mode-switcher button.active { background: var(--panel); color: var(--accent); border-color: #fff; }
  .single-picker-top select { font-family: var(--sans); font-size: 14px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 26px; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters select, .filters input[type=search] { font-family: var(--sans); font-size: 13px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  table.consolidated { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.consolidated th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
  table.consolidated th:hover { color: var(--text); }
  table.consolidated th.sorted::after { content: " ▾"; }
  table.consolidated td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.consolidated tr:hover td { background: rgba(255,255,255,0.03); }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .pill.project { background: var(--accent-soft); color: var(--accent); }
  .empty-cell { color: #5a6080; font-style: italic; }
  .row-count { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .deep-link-banner { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; padding: 8px 12px; background: var(--accent-soft); border-radius: 8px; }
  .deep-link-banner strong { color: var(--accent); }
  .deep-link-banner a { color: var(--accent); }

  .compare-pickers { display: flex; gap: 16px; margin-bottom: 18px; }
  .compare-pickers select { font-family: var(--sans); font-size: 14px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); flex: 1; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) {
    .compare-grid {
      grid-template-columns: none;
      grid-auto-flow: column;
      grid-auto-columns: 86vw;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      gap: 16px;
      padding-bottom: 6px;
      margin: 0 -16px;
      padding-left: 16px;
      padding-right: 16px;
    }
    .venture-col { scroll-snap-align: start; }
  }
  .venture-col h2 { font-size: 19px; margin: 0 0 2px; }
  .venture-col .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .tab-block { margin-bottom: 14px; }
  .tab-block h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin: 0 0 6px; padding-top: 10px; border-top: 1px solid var(--border); }
  .fm-row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; padding: 5px 0; font-size: 13px; line-height: 1.45; }
  .fm-key { font-family: var(--mono); font-size: 11.5px; color: var(--key); padding-top: 1px; }

  h1.vname { font-size: 26px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; }
  .status-tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .status-tag.status-green { background: var(--green-soft); color: var(--green); }
  .meta-line { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .single-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; overflow-x: auto; }
  .single-tabs button { font-family: var(--sans); font-size: 13.5px; padding: 8px 13px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .single-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .state-msg { font-size: 14px; color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">

      <button data-mode="table" class="active">Consolidated view</button>
      <button data-mode="compare">Compare</button>

  <div class="panel" id="panelCompare" style="display:none;"></div>

<script>

const FIELD_META = {

  fld554f8xSYqtx1Ye: {name:"DNS management", tab:"Infra", order:5},
  fldd55eEXIFfqYPQj: {name:"analytics provider", tab:"Infra", order:6},
  fldToUbONbYjGaAIk: {name:"backup strategy", tab:"Infra", order:7},
  fldp6axMCht0hWkDN: {name:"repo", tab:"Infra", order:8},
  fldotsmqLDmkhWYt3: {name:"email", tab:"Operations", order:9},
  fldfYvXdHT9U0RgOx: {name:"contact", tab:"Operations", order:10},
};
const TAB_ORDER = ["Market","Product","Traction","Infra","Operations","Finance","Acquisition","Labs"];
const NAME_F = "fld3JIuIA5FgdJv4F", STATUS_F = "fldyxQMf0DeLLvZaz", ROLE_F = "fldqooX9qDIYuzc7H",
      SECTION_F = "fldpKjCqmfWTsEZYq", VERTICAL_F = "fldytaVG4hsegzhJz", PRIORITY_F = "fldTrutNI5wLYPJPl",
      MOMENTUM_F = "fldWhQvMTLgGLrW0D", WEIGHT_F = "fldnTcpnT6lpnsNAm", GROUP_F = "fldbfrnARURZBDqk4";

let RECORDS = [];
let FIELD_NAMES = {};
let currentMode = "table";
let sortField = NAME_F, sortDir = 1;
let filterSection = "*", filterRole = "project", searchText = "";
let compareLeft = null, compareRight = null;
let singleSelected = null, singleTab = null;
let filterSectionList = null, filterGroupList = null, filterLabel = null;

function resolve(rec, fieldId) {
  const v = rec.fields ? rec.fields[fieldId] : rec.cellValuesByFieldId[fieldId];
  if (v === undefined || v === null) return null;
  if (Array.isArray(v)) return v.map(x => (x && typeof x === "object") ? x.name : x).join(", ");
  if (typeof v === "object") return v.name;
  return v;
}
function cellsOf(rec) { return rec.fields || rec.cellValuesByFieldId; }

// Le nom affiché d'un champ vient, par défaut, du nom réel du champ dans Airtable
// (fourni par portfolio.json au sync, via l'API Meta) — pas d'un libellé recopié
// à la main ici. FIELD_META[fid].name n'est une surcharge que quand le site veut
// un mot plus court que le nom Airtable (ex. "contact email" -> "email").
function fieldLabel(fid) {
  const meta = FIELD_META[fid];
  return (meta && meta.name) || FIELD_NAMES[fid] || fid;
}

// Le statut Airtable est stocké "N/5 — mot" (ex. "2/5 — landing") pour le
// tri/la momentum interne, mais le préfixe numérique n'apporte rien à
// l'affichage — on ne garde que le mot.
function statusText(v) {
  if (!v) return v;
  return v.replace(/^\d\/5\s*—\s*/, "");
}

// "landing" et "online" doivent toujours ressortir en vert, quelle que soit
// la couleur assignée à l'option côté Airtable (ex. "online" y est en teal).
function statusClass(v) {
  if (!v) return "";
  const low = v.toLowerCase();
  return (low.includes("landing") || low.includes("online")) ? " status-green" : "";
}

// Une valeur de champ qui EST un lien (URL complète http(s)://... ou domaine nu du type
// "labs.vetnups.com", "clauslabs.ai") se rend comme un vrai <a href> cliquable plutôt que
// comme du texte plat — "le hub renvoie, il ne discute pas". Domaine nu -> on préfixe https://.
// Pour les champs dont la valeur est une URL interne longue (landing/traction/deployment),
// LINK_LABELS donne un texte de lien court plutôt que d'afficher l'URL complète.
const LINK_LABELS = {
  fldu1iQBrGZuKUKuf: "structure",
  fldOLfNxsvfpFS37T: "status",
  fld7d4gZlGVKxqyLO: "metrics",
  fldfYvXdHT9U0RgOx: "doc",
};
function linkify(v, fid) {
  if (!v) return "—";
  const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/i.test(v);
  if (isEmail) return `<a href="mailto:${v}">${v}</a>`;
  const isUrl = /^https?:\/\//i.test(v);
  const isBareDomain = /^([a-z0-9-]+\.)+[a-z]{2,}(\/[^\s]*)?$/i.test(v);
  if (isUrl || isBareDomain) {
    const href = isUrl ? v : `https://${v}`;
    const githubMatch = href.match(/^https?:\/\/github\.com\/([^\/\s]+\/[^\/\s]+?)(?:\.git)?\/?$/i);
    const label = (fid && LINK_LABELS[fid]) || (githubMatch && githubMatch[1]) || v;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  }
  return v;
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".mode-switcher button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.getElementById("panelTable").style.display = mode === "table" ? "" : "none";
  document.getElementById("panelCompare").style.display = mode === "compare" ? "" : "none";
  document.getElementById("panelSingle").style.display = mode === "single" ? "" : "none";
  document.getElementById("singlePickerTop").style.display = mode === "single" ? "" : "none";
  renderAll();
}
document.querySelectorAll(".mode-switcher button").forEach(b => b.addEventListener("click", () => switchMode(b.dataset.mode)));

function renderTable() {
  const sections = [...new Set(RECORDS.map(r => resolve(r, SECTION_F)).filter(Boolean))].sort();
  let rows = RECORDS.filter(r => {
    if (filterGroupList) {
      if (!filterGroupList.includes(resolve(r, GROUP_F))) return false;
    } else if (filterSectionList) {
      if (!filterSectionList.includes(resolve(r, SECTION_F))) return false;
    } else if (filterSection !== "*" && resolve(r, SECTION_F) !== filterSection) return false;
    if (filterRole !== "*" && resolve(r, ROLE_F) !== filterRole) return false;
    if (searchText) {
      const hay = (resolve(r, NAME_F) + " " + (resolve(r, VERTICAL_F) || "")).toLowerCase();
      if (!hay.includes(searchText.toLowerCase())) return false;
    }
    return true;
  });
  rows.sort((a, b) => {
    const av = resolve(a, sortField) || "", bv = resolve(b, sortField) || "";
    return av.localeCompare(bv) * sortDir;
  });

  const cols = [
    [NAME_F, "Name"], [STATUS_F, "Status"], [SECTION_F, "Site section"], [VERTICAL_F, "Vertical"],
    [ROLE_F, "Role"], [PRIORITY_F, "Exec. priority"], [MOMENTUM_F, "Momentum"], [WEIGHT_F, "Exec. weight"],
  ];

  document.getElementById("panelTable").innerHTML = `
    ${filterLabel ? `<div class="deep-link-banner">Filtered view from the site: <strong>${filterLabel}</strong> · <a href="#" id="clearFilterLink">view full portfolio</a></div>` : ""}
    <div class="filters">
      <input type="search" placeholder="Search…" id="searchBox" value="${searchText}">
      <select id="sectionFilter">
        <option value="*">All sections</option>
        ${sections.map(s => `<option value="${s}" ${!filterSectionList && s===filterSection?"selected":""}>${s}</option>`).join("")}
      </select>
      <select id="roleFilter">
        <option value="*">All roles</option>
        <option value="project" ${filterRole==="project"?"selected":""}>project</option>
        <option value="benchmark" ${filterRole==="benchmark"?"selected":""}>benchmark</option>
      </select>
    </div>
    <div class="row-count">${rows.length} ${rows.length>1?"entities":"entity"} shown out of ${RECORDS.length}</div>
    <table class="consolidated">
      <thead><tr>${cols.map(([f,l]) => `<th data-f="${f}" class="${f===sortField?"sorted":""}">${l}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(r => `<tr>${cols.map(([f]) => {
          const v = resolve(r, f);
          if (f === ROLE_F) return `<td><span class="pill ${v==="project"?"project":""}">${v||"—"}</span></td>`;
          if (f === STATUS_F) return `<td>${v ? statusText(v) : '<span class="empty-cell">—</span>'}</td>`;
          return `<td>${v ? v : '<span class="empty-cell">—</span>'}</td>`;
        }).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
  document.getElementById("searchBox").addEventListener("input", e => { searchText = e.target.value; renderTable(); });
  document.getElementById("sectionFilter").addEventListener("change", e => { filterSectionList = null; filterGroupList = null; filterLabel = null; filterSection = e.target.value; renderTable(); });
  document.getElementById("roleFilter").addEventListener("change", e => { filterRole = e.target.value; renderTable(); });
  document.querySelectorAll("table.consolidated th").forEach(th => {
    th.addEventListener("click", () => {
      const f = th.dataset.f;
      if (sortField === f) sortDir *= -1; else { sortField = f; sortDir = 1; }
      renderTable();
    });
  });
  const clearLink = document.getElementById("clearFilterLink");
  if (clearLink) clearLink.addEventListener("click", e => { e.preventDefault(); clearDeepLink(); });
}

// fieldIds optionnel : si fourni, on rend EXACTEMENT cette liste de champs, dans cet ordre,
// même absents pour ce record (case "—" grisée) — c'est ce qui garantit l'alignement
// ligne à ligne entre les deux colonnes de la vue Comparer. Sans fieldIds (Fiche individuelle),
// on ne montre que les champs renseignés pour ce record, triés par leur "order" d'onglet.
function renderTabsFor(rec, fieldIds) {
  const ids = fieldIds || Object.keys(cellsOf(rec));
  const byTab = {};
  TAB_ORDER.forEach(t => byTab[t] = []);
  ids.forEach(fid => {
    const meta = FIELD_META[fid];
    if (!meta || !TAB_ORDER.includes(meta.tab)) return;
    const v = resolve(rec, fid);
    if (fieldIds || v) byTab[meta.tab].push([v, meta.order || 999, fid]);
  });
  TAB_ORDER.forEach(t => byTab[t].sort((a,b) => a[1]-b[1]));
  return TAB_ORDER.filter(t => byTab[t].length).map(t =>
    `<div class="tab-block"><h3>${t}</h3>${byTab[t].map(([v,,fid]) => `<div class="fm-row"><div class="fm-key">${fieldLabel(fid)}</div><div class="${v?"":"empty-cell"}">${linkify(v,fid)}</div></div>`).join("")}</div>`
  ).join("");
}

// Union des champs renseignés (à gauche OU à droite), triée par onglet puis par "order" —
// c'est cette liste commune, appliquée identiquement aux deux colonnes, qui fait que
// "value prop" tombe toujours sur la même ligne à gauche et à droite, même quand
// l'une des deux entités a des champs que l'autre n'a pas (ex : network scope).
function buildUnionFieldIds(left, right) {
  return Object.keys(FIELD_META)
    .filter(fid => {
      const meta = FIELD_META[fid];
      if (!meta || !TAB_ORDER.includes(meta.tab)) return false;
      return resolve(left, fid) || resolve(right, fid);
    })
    .sort((a, b) => {
      const ma = FIELD_META[a], mb = FIELD_META[b];
      const ta = TAB_ORDER.indexOf(ma.tab), tb = TAB_ORDER.indexOf(mb.tab);
      if (ta !== tb) return ta - tb;
      return (ma.order || 999) - (mb.order || 999);
    });
}

function renderCompare() {
  if (!compareLeft) compareLeft = (RECORDS.find(r => resolve(r, NAME_F).trim() === "Vetnups") || RECORDS[0]).id;
  if (!compareRight) compareRight = (RECORDS.find(r => resolve(r, NAME_F).trim() === "Curb") || RECORDS[1] || RECORDS[0]).id;
  const options = RECORDS.slice().sort((a,b) => resolve(a,NAME_F).localeCompare(resolve(b,NAME_F)))
    .map(r => `<option value="${r.id}">${resolve(r,NAME_F)} ${resolve(r,ROLE_F)==="benchmark"?"(benchmark)":""}</option>`).join("");
  const left = RECORDS.find(r => r.id === compareLeft), right = RECORDS.find(r => r.id === compareRight);
  const unionIds = buildUnionFieldIds(left, right);
  document.getElementById("panelCompare").innerHTML = `
    ${filterLabel ? `<div class="deep-link-banner">Filtered view from the site: <strong>${filterLabel}</strong> · <a href="#" id="clearFilterLink">view full portfolio</a></div>` : ""}
    <div class="compare-pickers">
      <select id="cmpLeft">${options}</select>
      <select id="cmpRight">${options}</select>
    </div>
    <div class="compare-grid">
      <div class="venture-col"><h2>${resolve(left,NAME_F)}</h2><div class="sub">${resolve(left,SECTION_F)||"—"} · ${statusText(resolve(left,STATUS_F))||"—"}</div>${renderTabsFor(left, unionIds)}</div>
      <div class="venture-col"><h2>${resolve(right,NAME_F)}</h2><div class="sub">${resolve(right,SECTION_F)||"—"} · ${statusText(resolve(right,STATUS_F))||"—"}</div>${renderTabsFor(right, unionIds)}</div>
    </div>
  `;
  document.getElementById("cmpLeft").value = compareLeft;
  document.getElementById("cmpRight").value = compareRight;
  document.getElementById("cmpLeft").addEventListener("change", e => { compareLeft = e.target.value; renderCompare(); });
  document.getElementById("cmpRight").addEventListener("change", e => { compareRight = e.target.value; renderCompare(); });
  const clearLink = document.getElementById("clearFilterLink");
  if (clearLink) clearLink.addEventListener("click", e => { e.preventDefault(); clearDeepLink(); });
}

function renderSingle() {
  if (!singleSelected) singleSelected = (RECORDS.find(r => resolve(r, NAME_F).trim() === "Vetnups") || RECORDS[0]).id;
  const rec = RECORDS.find(r => r.id === singleSelected);
  const cells = cellsOf(rec);
  const byTab = {};
  TAB_ORDER.forEach(t => byTab[t] = []);
  Object.keys(cells).forEach(fid => {
    const meta = FIELD_META[fid];
    if (!meta || !TAB_ORDER.includes(meta.tab)) return;
    const v = resolve(rec, fid);
    if (v) byTab[meta.tab].push([v, meta.order || 999, fid]);
  });
  TAB_ORDER.forEach(t => byTab[t].sort((a,b) => a[1]-b[1]));
  // Tous les onglets de TAB_ORDER restent visibles, même sans champ renseigné pour cette venture
  // (ex. Product, encore vide, sert de rappel actif tant qu'aucun champ produit n'a été créé).
  const availableTabs = TAB_ORDER;
  if (!singleTab || !availableTabs.includes(singleTab)) singleTab = availableTabs[0];

  const options = RECORDS.slice().sort((a,b) => resolve(a,NAME_F).localeCompare(resolve(b,NAME_F)))
    .map(r => `<option value="${r.id}">${resolve(r,NAME_F)} ${resolve(r,ROLE_F)==="benchmark"?"(benchmark)":""}</option>`).join("");

  const singleRows = byTab[singleTab] || [];
  document.getElementById("panelSingle").innerHTML = `
    <div class="meta-line">${resolve(rec,SECTION_F) || "—"}</div>
    <h1 class="vname">${resolve(rec,NAME_F)} <span class="status-tag${statusClass(resolve(rec,STATUS_F))}">${statusText(resolve(rec,STATUS_F)) || "—"}</span></h1>
    <div class="single-tabs">${availableTabs.map(t => `<button data-t="${t}" class="${t===singleTab?"active":""}">${t}</button>`).join("")}</div>
    <div class="tab-block">${singleRows.length ? singleRows.map(([v,,fid]) => `<div class="fm-row"><div class="fm-key">${fieldLabel(fid)}</div><div>${linkify(v,fid)}</div></div>`).join("") : `<div class="state-msg">Aucun champ pour l'onglet ${singleTab} pour l'instant.</div>`}</div>
  `;
  const singlePick = document.getElementById("singlePick");
  singlePick.innerHTML = options;
  singlePick.value = singleSelected;
  singlePick.onchange = e => { singleSelected = e.target.value; singleTab = null; renderSingle(); };
  document.querySelectorAll(".single-tabs button").forEach(b => b.addEventListener("click", () => { singleTab = b.dataset.t; renderSingle(); }));
}

function renderAll() {
  if (currentMode === "table") renderTable();
  if (currentMode === "compare") renderCompare();
  if (currentMode === "single") renderSingle();
}

function setActiveModeButtons() {
  document.querySelectorAll(".mode-switcher button").forEach(b => b.classList.toggle("active", b.dataset.mode === currentMode));
  document.getElementById("panelTable").style.display = currentMode === "table" ? "" : "none";
  document.getElementById("panelCompare").style.display = currentMode === "compare" ? "" : "none";
  document.getElementById("panelSingle").style.display = currentMode === "single" ? "" : "none";
  document.getElementById("singlePickerTop").style.display = currentMode === "single" ? "" : "none";
}

// Permet aux pages de catégorie du site de renvoyer ici une vue déjà filtrée.
// ?venture=Curb                           — ouvre directement la Fiche individuelle de cette entité
//   (utilisé par les pages hub pour un lien "nom d'entreprise" -> sa propre fiche)
// ?group=Tech-Native%20Networks           — filtre sur le champ "portfolio group"
//   (un seul groupe par lien, c'est ce niveau qui correspond 1:1 aux pages du site)
// ?section=Managed%20Marketplaces         — filtre sur "site section" (ancien mécanisme, gardé pour compat)
// Si le filtre isole exactement 2 entités, on ouvre directement la vue Comparer.
function applyDeepLink() {
  const params = new URLSearchParams(location.search);
  const ventureParam = params.get("venture");
  if (ventureParam) {
    const rec = RECORDS.find(r => resolve(r, NAME_F).trim() === ventureParam.trim());
    if (rec) {
      singleSelected = rec.id;
      singleTab = null;
      currentMode = "single";
      setActiveModeButtons();
      return;
    }
  }
  const groupParam = params.get("group");
  const sectionParam = params.get("section");
  let wanted, matches;
  if (groupParam) {
    wanted = groupParam.split(",").map(s => s.trim()).filter(Boolean);
    matches = RECORDS.filter(r => wanted.includes(resolve(r, GROUP_F)));
    if (!matches.length) return;
    filterGroupList = wanted;
  } else if (sectionParam) {
    wanted = sectionParam.split(",").map(s => s.trim()).filter(Boolean);
    matches = RECORDS.filter(r => wanted.includes(resolve(r, SECTION_F)));
    if (!matches.length) return;
    filterSectionList = wanted;
  } else {
    return;
  }
  filterLabel = params.get("label") || wanted.join(" + ");
  if (matches.length === 2) {
    compareLeft = matches[0].id;
    compareRight = matches[1].id;
    currentMode = "compare";
  } else {
    currentMode = "table";
  }
  setActiveModeButtons();
}

function clearDeepLink() {
  filterSectionList = null;
  filterGroupList = null;
  filterLabel = null;
  filterSection = "*";
  renderAll();
}

async function boot() {
  try {
    const res = await fetch("./portfolio.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    FIELD_NAMES = data.fieldNames || {};
    RECORDS = data.records;
    applyDeepLink();
    renderAll();
  } catch (err) {
    document.getElementById("panelTable").innerHTML = `<div class="state-msg">Unable to load portfolio.json (${err.message}). Check that the file exists next to this page and that the Airtable export has run.</div>`;
  }
}
boot();
</script>
