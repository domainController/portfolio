<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Ventures — Patrice Kenmoé</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">

    <div class="meta-bar">
      <div class="meta-left">
        <span class="category">Portfolio</span>
        <span class="sep">·</span>
        <span>Version 0.1.0</span>
        <span class="sep">·</span>
        <span id="last-updated">Updated —</span>
      </div>
    </div>

    <h1>Tech Ventures</h1>
    <div class="subtitle">Mobile &amp; web platforms — different scaling models, same tech core.</div>

    <div class="children">
      <div class="child"><a href="../startups/index.html">Community Startups</a> <span class="status-tag status-live">live</span><div class="child-desc">Dating app &amp; review platform.</div></div>
      <div class="child"><a href="../marketplace/index.html">Managed Marketplaces</a> <span class="status-tag status-draft">draft</span><div class="child-desc">Marketplaces that manage the transaction, not just the listing.</div></div>
    </div>

  </div>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'techventures/index.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
</body>
</html>
