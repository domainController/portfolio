<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Portfolio Site — Patrice Kenmoé</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">

    <div class="meta-bar">
      <div class="meta-left">
        <a class="home-icon" href="../index.html" title="Home">&#8962;</a>
        <span class="sep">·</span>
        <a class="nav-back" href="../index.html">Portfolio</a>
        <span class="sep">·</span>
        <span id="last-updated">Updated —</span>
      </div>
    </div>

    <h1>This Portfolio Site</h1>
    <div class="branch-desc">Attributes.</div>

    <div class="frontmatter">
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">value prop</span></div><div class="fm-value">Catalogs the technical attributes of every active domain.</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">repo</span></div><div class="fm-value"><a class="link-external" href="https://github.com/domainController/portfolio">domainController/portfolio</a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">traction</span></div><div class="fm-value"><a class="link-live" href="traction.html">Live site</a> <span class="status-tag status-live">live</span></div></div>
    </div>

  </div>
<script>
(function () {
  var origFetch = window.fetch;
  window.fetch = function (url) {
    if (typeof url === 'string' && url.indexOf('api.github.com/repos/') !== -1) {
      var cacheKey = 'ghcache_' + url;
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(cacheKey)); } catch (e) {}
      var now = Date.now();
      if (cached && (now - cached.t) < 15 * 60 * 1000) {
        return Promise.resolve({ json: function () { return Promise.resolve(cached.d); } });
      }
      return origFetch.apply(this, arguments).then(function (r) {
        return r.json().then(function (data) {
          if (data && !data.message) {
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: now, d: data })); } catch (e) {}
          } else if (cached) {
            data = cached.d;
          }
          return { json: function () { return Promise.resolve(data); } };
        });
      }).catch(function () {
        if (cached) return { json: function () { return Promise.resolve(cached.d); } };
        return { json: function () { return Promise.resolve([]); } };
      });
    }
    return origFetch.apply(this, arguments);
  };
})();
</script>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'meta/index.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
</body>
</html>
