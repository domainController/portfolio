<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment Activity — Patrice Kenmoé</title>
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">

    <div class="meta-bar">
      <div class="meta-left">
        <a class="home-icon" href="../../index.html" title="Home">&#8962;</a>
        <span class="sep">·</span>
        <a class="nav-back" href="../traction.html">This Portfolio Site</a>
        <span class="sep">·</span>
        <span id="last-updated">Updated —</span>
      </div>
    </div>

    <h1>Deployment Activity</h1>
    <div class="branch-desc">Full history, computed live from the repo's commit log.</div>

    <div class="frontmatter">
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">launch</span></div><div class="fm-value"><span id="launch-date">—</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">uptime</span></div><div class="fm-value"><span id="uptime-detail">—</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">total</span></div><div class="fm-value"><span id="total-commits">—</span> commits</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">active</span></div><div class="fm-value"><span id="active-days">—</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">silent</span></div><div class="fm-value"><span id="silent-days">—</span></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">peak day</span></div><div class="fm-value"><span id="peak-day">—</span></div></div>
    </div>

    <div id="full-chart" style="margin-top:20px;"></div>

  </div>
<script>
(function () {
  var origFetch = window.fetch;
  window.fetch = function (url) {
    if (typeof url === 'string' && url.indexOf('api.github.com/repos/') !== -1) {
      var cacheKey = 'ghcache_' + url;
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(cacheKey)); } catch (e) {}
      var now = Date.now();
      if (cached && (now - cached.t) < 15 * 60 * 1000) {
        return Promise.resolve({ json: function () { return Promise.resolve(cached.d); } });
      }
      return origFetch.apply(this, arguments).then(function (r) {
        return r.json().then(function (data) {
          if (data && !data.message) {
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: now, d: data })); } catch (e) {}
          } else if (cached) {
            data = cached.d;
          }
          return { json: function () { return Promise.resolve(data); } };
        });
      }).catch(function () {
        if (cached) return { json: function () { return Promise.resolve(cached.d); } };
        return { json: function () { return Promise.resolve([]); } };
      });
    }
    return origFetch.apply(this, arguments);
  };
})();
</script>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'meta/commits/index.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
<script>
(function () {
  var repo = 'domainController/portfolio';
  fetch('https://api.github.com/repos/' + repo + '/commits?per_page=100')
    .then(function (r) { return r.json(); })
    .then(function (commits) {
      if (!commits || !commits.length || commits.message) return;
      commits.reverse();

      function fmtUptime(ms) {
        var totalDays = Math.floor(ms / 86400000);
        var hours = Math.floor((ms % 86400000) / 3600000);
        if (totalDays < 1) return hours + (hours === 1 ? ' hour' : ' hours');
        if (totalDays < 7) return totalDays + (totalDays === 1 ? ' day' : ' days') + ', ' + hours + (hours === 1 ? ' hour' : ' hours');
        var years = Math.floor(totalDays / 365);
        var remAfterYears = totalDays % 365;
        var months = Math.floor(remAfterYears / 30);
        var remAfterMonths = remAfterYears % 30;
        var weeks = Math.floor(remAfterMonths / 7);
        var days = remAfterMonths % 7;
        var parts = [];
        if (years > 0) parts.push(years + (years === 1 ? ' year' : ' years'));
        if (months > 0) parts.push(months + (months === 1 ? ' month' : ' months'));
        if (weeks > 0) parts.push(weeks + (weeks === 1 ? ' week' : ' weeks'));
        if (years === 0 && months === 0) {
          if (days > 0 || parts.length === 0) parts.push(days + (days === 1 ? ' day' : ' days'));
        }
        return parts.join(', ');
      }

      var counts = {};
      commits.forEach(function (c) {
        var d = new Date(c.commit.committer.date);
        var key = d.toISOString().slice(0, 10);
        counts[key] = (counts[key] || 0) + 1;
      });

      var first = new Date(commits[0].commit.committer.date);
      var firstDay = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), first.getUTCDate()));
      var now = new Date();
      var today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
      var spanDays = Math.round((today - firstDay) / 86400000) + 1;

      var allDays = [];
      for (var i = 0; i < spanDays; i++) {
        var d = new Date(firstDay.getTime() + i * 86400000);
        var key = d.toISOString().slice(0, 10);
        allDays.push([key, counts[key] || 0]);
      }

      var total = commits.length;
      var maxVal = Math.max.apply(null, allDays.map(function (p) { return p[1]; }));
      var peakEntry = allDays.filter(function (p) { return p[1] === maxVal; })[0];
      var activeDays = allDays.filter(function (p) { return p[1] > 0; }).length;
      var silentDays = spanDays - activeDays;

      function fmtDay(key) {
        var d = new Date(key + 'T00:00:00Z');
        return d.toLocaleString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      }

      var launchDateEl = document.getElementById('launch-date');
      if (launchDateEl) {
        var lopts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' };
        launchDateEl.textContent = first.toLocaleString('en-US', lopts) + ' UTC';
      }
      var uptimeDetailEl = document.getElementById('uptime-detail');
      if (uptimeDetailEl) uptimeDetailEl.textContent = fmtUptime(now - first);
      document.getElementById('total-commits').textContent = total;
      document.getElementById('active-days').textContent = activeDays + ' / ' + spanDays + ' days';
      document.getElementById('silent-days').textContent = fmtUptime(silentDays * 86400000) + ' with zero commits';
      document.getElementById('peak-day').textContent = fmtDay(peakEntry[0]) + ' (' + maxVal + ' commits, ' + Math.round(maxVal / total * 100) + '% of all commits)';
      var durationDaysEl = document.getElementById('duration-days'); if (durationDaysEl) durationDaysEl.textContent = fmtUptime(spanDays * 86400000);

      var w = 720, h = 240, padL = 34, padR = 12, padT = 16, padB = 30;
      var innerW = w - padL - padR, innerH = h - padT - padB;
      var n = allDays.length;
      var step = n > 1 ? innerW / (n - 1) : 0;
      var pts = allDays.map(function (p, i) {
        var x = padL + i * step;
        var y = padT + innerH - (maxVal > 0 ? (p[1] / maxVal) * innerH : 0);
        return [x, y, p[1], p[0]];
      });

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      svg.setAttribute('width', '100%'); svg.setAttribute('height', h);

      var maxTicks = 4;
      var rawStep = maxVal > 0 ? maxVal / maxTicks : 1;
      var mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
      var norm = rawStep / mag;
      var step = Math.max(1, Math.round((norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag));
      var ticks = [0];
      for (var t = step; t < maxVal; t += step) ticks.push(Math.round(t));
      if (maxVal > 0) ticks.push(maxVal);

      ticks.forEach(function (tick) {
        var y = padT + innerH - (maxVal > 0 ? (tick / maxVal) * innerH : innerH);
        var line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', padL); line.setAttribute('x2', w - padR);
        line.setAttribute('y1', y); line.setAttribute('y2', y);
        line.setAttribute('stroke', '#161a33'); line.setAttribute('stroke-width', '1');
        svg.appendChild(line);
        var label = document.createElementNS(svgNS, 'text');
        label.setAttribute('x', padL - 8); label.setAttribute('y', y + 4);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('font-family', "'SF Mono', Consolas, monospace");
        label.setAttribute('font-size', '13'); label.setAttribute('fill', '#8a90a8');
        label.textContent = tick;
        svg.appendChild(label);
      });

      var d = '';
      if (pts.length === 1) {
        d = 'M ' + pts[0][0] + ' ' + pts[0][1];
      } else {
        d = 'M ' + pts[0][0] + ' ' + pts[0][1];
        for (var i = 1; i < pts.length; i++) {
          d += ' L ' + pts[i][0] + ' ' + pts[i][1];
        }
      }
      var path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#6bb3f0');
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);

      var labelEvery = Math.max(1, Math.ceil(n / 8));
      pts.forEach(function (p, i) {
        if (i % labelEvery === 0 || i === pts.length - 1) {
          var dlabel = document.createElementNS(svgNS, 'text');
          dlabel.setAttribute('x', p[0]); dlabel.setAttribute('y', h - 8);
          dlabel.setAttribute('text-anchor', 'middle');
          dlabel.setAttribute('font-family', "'SF Mono', Consolas, monospace");
          dlabel.setAttribute('font-size', '12'); dlabel.setAttribute('fill', '#8a90a8');
          dlabel.textContent = fmtDay(p[3]);
          svg.appendChild(dlabel);
        }
      });

      var durLabel = document.createElementNS(svgNS, 'text');
      durLabel.setAttribute('x', w - padR); durLabel.setAttribute('y', padT);
      durLabel.setAttribute('text-anchor', 'end');
      durLabel.setAttribute('font-family', "'SF Mono', Consolas, monospace");
      durLabel.setAttribute('font-size', '11'); durLabel.setAttribute('fill', '#8a90a8');
      durLabel.textContent = spanDays + ' days total';
      svg.appendChild(durLabel);

      var container = document.getElementById('full-chart');
      if (container) container.appendChild(svg);
    })
    .catch(function () {});
})();
</script>
</body>
</html>
