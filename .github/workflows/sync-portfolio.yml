name: Sync portfolio.json from Airtable

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (minimum GitHub Actions) ; ajuste ou passe en repository_dispatch si tu préfères déclencher depuis Airtable
  workflow_dispatch: {}       # bouton "Run workflow" manuel dans l'onglet Actions

# Handoff 49 : à 5 min d'intervalle, deux runs peuvent facilement se chevaucher
# (schedule + un déclenchement manuel, ou deux schedules si un run traîne) —
# cette clé les sérialise au lieu de les laisser courir en parallèle et se
# marcher dessus au push. cancel-in-progress: false = la queue attend son tour
# plutôt que de tuer un run déjà en cours (on ne veut pas perdre un commit).
concurrency:
  group: portfolio-sync
  cancel-in-progress: false

permissions:
  contents: write   # le token par défaut est en lecture seule sur ce repo ; sans ça, le git push final échoue en 403

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exporter Airtable vers portfolio.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/export-airtable.mjs

      - name: Committer si portfolio.json a changé
        run: |
          git config user.name "portfolio-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio.json
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "sync: portfolio.json depuis Airtable"
          # Handoff 49 : filet de sécurité en plus de concurrency ci-dessus, pour le
          # cas restant non couvert (un commit humain poussé entre le checkout et ce
          # push). Rebase sur origin/main et réessaie, jusqu'à 3 fois, au lieu
          # d'échouer sur un simple rejet non-fast-forward.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté (tentative $attempt/3), rebase sur origin/main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Échec du push après 3 tentatives de rebase." >&2
          exit 1
