    <h1>Möttrum</h1>
    <div class="branch-desc">Attributes.</div>

    <div class="frontmatter">
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">value prop</span></div><div class="fm-value">Marketplace for pre-litigation assets.</div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">website</span></div><div class="fm-value"><a class="link-external" href="https://mottrum.com">mottrum.com</a></div></div>
      <div class="fm-row"><div class="fm-key-col"><span class="fm-key">traction</span></div><div class="fm-value"><a class="link-internal" href="traction.html">Live site</a></div></div>

    </div>

  </div>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'legal-lab/legal-finance/mottrum/index.html';
  fetch('https://api.github.com/repos/domainController/portfolio/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Updated ' + d.toLocaleString('en-US', opts);
    })
    .catch(function () { });
})();
</script>
</body>
