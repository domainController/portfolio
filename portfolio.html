<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Ventures</title>
<style>
  /* Palette recopiée depuis css/style.css (le thème du site) plutôt qu'importée,
     pour que cette page reste autonome (aucune dépendance externe, CSS inline). */
  :root {
    --bg: #0a0e27; --panel: #161a33; --border: #232849; --text: #fff;
    --muted: #8a90a8; --key: #7a8296; --accent: #4a90e2; --accent-soft: rgba(74,144,226,0.15);
    --green: #6bcf7f; --green-soft: rgba(107,207,127,0.15);
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); }
  a:hover { color: #6bb3f0; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); padding: 28px 16px 80px; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .mode-switcher { display: flex; gap: 8px; }
  .mode-switcher button { font-family: var(--sans); font-size: 14px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer; }
  .mode-switcher button.active { background: var(--panel); color: var(--accent); border-color: var(--accent); }
  .single-picker-top select { font-family: var(--sans); font-size: 14px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 26px; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters select, .filters input[type=search] { font-family: var(--sans); font-size: 13px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.consolidated { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.consolidated th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
  table.consolidated th:hover { color: var(--text); }
  table.consolidated th.sorted::after { content: " ▾"; }
  table.consolidated td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.consolidated tbody tr.row-clickable { cursor: pointer; }
  table.consolidated tbody tr.row-clickable:hover td { background: rgba(255,255,255,0.03); }
  table.consolidated tr:hover td { background: rgba(255,255,255,0.03); }
  /* Classe dédiée (pas table.consolidated) : renderTable() attache ses handlers de tri/clic
     de ligne via document.querySelectorAll("table.consolidated ..."), une recherche globale
     au document -- réutiliser la même classe aurait accroché ce comportement (tri cassé,
     clic de ligne qui écrase singleSelected) sur la galerie Value Props dès qu'on serait
     ensuite passé par Consolidated view. */
  table.vp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.vp-table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.vp-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .empty-cell { color: #5a6080; font-style: italic; }
  .row-count { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .cluster-title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .cluster-title-row .row-count { margin-bottom: 0; white-space: nowrap; }
  .deep-link-banner { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; padding: 8px 12px; background: var(--accent-soft); border-radius: 8px; }
  .deep-link-banner strong { color: var(--accent); }
  .deep-link-banner a { color: var(--accent); }

  .compare-pickers { display: flex; gap: 16px; margin-bottom: 18px; }
  .compare-pickers select { font-family: var(--sans); font-size: 14px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--text); flex: 1; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) {
    .compare-grid {
      grid-template-columns: none;
      grid-auto-flow: column;
      grid-auto-columns: 86vw;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      gap: 16px;
      padding-bottom: 6px;
      margin: 0 -16px;
      padding-left: 16px;
      padding-right: 16px;
    }
    .venture-col { scroll-snap-align: start; }
  }
  .venture-col h2 { font-size: 19px; margin: 0 0 2px; }
  .venture-col .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .tab-block { margin-bottom: 14px; }
  .tab-block h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin: 0 0 6px; padding-top: 10px; border-top: 1px solid var(--border); }
  .fm-row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; padding: 5px 0; font-size: 13px; line-height: 1.45; }
  .fm-key { font-family: var(--mono); font-size: 11.5px; color: var(--key); padding-top: 1px; }

  h1.vname { font-size: 26px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; }
  .cluster-list { margin-top: 14px; border-top: 1px solid var(--border); }
  .cluster-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .cluster-row[data-detail-toggle] { cursor: pointer; }
  .cluster-row:hover { background: rgba(255,255,255,0.03); }
  .cluster-row-main { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .cluster-row-name { font-size: 14.5px; font-weight: 600; }
  .cluster-row-type { font-size: 12.5px; color: var(--muted); flex: 1; }
  .cluster-section-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--key); margin: 18px 0 6px; padding-top: 14px; border-top: 1px solid var(--border); }
  /* Le premier label de section n'a pas de bordure propre (déjà tracée par .cluster-list
     juste au-dessus, pas de double trait) mais garde le même padding-top que les suivants
     (Patrice, capture Möttrum/Frame : "Divisions"/"Labs" collé au filet quand il apparaît
     en premier, alors que les sections suivantes respirent) — sinon le texte colle au
     filet au lieu d'avoir le même espace que les autres labels ont après le leur. */
  .cluster-section-label:first-of-type { margin-top: 0; padding-top: 14px; border-top: none; }
  .cluster-row-badge { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
  .pill.scope-mode { background: rgba(212,169,73,0.15); color: #d4a949; }
  .cluster-row-name:hover { color: var(--accent); text-decoration: underline; }
  .cluster-row-expand-hint { display: inline-block; color: var(--muted); transition: transform 0.15s; }
  .cluster-row.expanded .cluster-row-expand-hint { transform: rotate(180deg); }
  .corps-toggle { font-size: 12.5px; color: var(--muted); cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
  .corps-toggle.expanded .cluster-row-expand-hint { transform: rotate(180deg); }
  .cluster-row-detail { display: none; padding: 2px 4px 14px; }
  .cluster-row-detail.open { display: block; }
  .cluster-block { margin-bottom: 32px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
  .cluster-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .cluster-block-header[data-toggle] { cursor: pointer; }
  .cluster-block-header.compact .vname { font-size: 15px; margin: 0; gap: 8px; }
  .cluster-block-header.compact .vname .status-tag { font-size: 10.5px; padding: 1px 6px; }
  .cluster-block-header.compact .meta-line { font-size: 11px; margin-bottom: 2px; }
  .cluster-block-header.compact .row-count { font-size: 11.5px; }
  .cluster-list.collapsed { display: none; }
  .cluster-expand-hint { display: inline-block; margin-left: 6px; color: var(--muted); transition: transform 0.15s; }
  .cluster-block-header.expanded .cluster-expand-hint { transform: rotate(180deg); }
  .status-tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--border); color: var(--muted); }
  /* Palette de statut partagée avec css/style.css (pages de nav) — un mot, une couleur,
     partout sur le site, que la pastille soit un .status-tag (fiche) ou un .pill (mini-pastille
     accolée à un champ Labs/Infra via pillFor()). */
  .status-live, .status-landing { background: #16311f; color: #6bcf7f; }
  .status-draft { background: #332412; color: #e0a94a; }
  .status-concept { background: #2a1a2e; color: #d47fc9; }
  .status-build { background: #2e2712; color: #d4b83a; }
  .status-online { background: #0d3329; color: #4ae0b3; }
  .status-signal { background: #0d2b33; color: #4ac8e0; }
  .status-beta, .status-project { background: #16233d; color: #6bb3f0; }
  .status-not-started { background: #16233d; color: #5a6080; }
  .meta-line { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .meta-line a { color: var(--accent); text-decoration: none; }
  .meta-line a:hover { text-decoration: underline; }
  .single-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; overflow-x: auto; }
  .single-tabs button { font-family: var(--sans); font-size: 13.5px; padding: 8px 13px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .single-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .state-msg { font-size: 14px; color: var(--muted); padding: 40px 0; text-align: center; }

  .top-bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .home-icon, .nav-back { color: var(--muted); text-decoration: none; font-size: 1.05em; line-height: 1; }
  .home-icon:hover, .nav-back:hover { color: var(--accent); }
  .top-bar-left .sep { color: var(--border); }
</style>
</head>

function resolve(rec, fieldId) {
  const v = rec.fields ? rec.fields[fieldId] : rec.cellValuesByFieldId[fieldId];
  if (v === undefined || v === null) return null;
  if (Array.isArray(v)) return v.map(x => (x && typeof x === "object") ? x.name : x).join(", ");
  if (typeof v === "object") return v.name;
  return v;
}
function cellsOf(rec) { return rec.fields || rec.cellValuesByFieldId; }

// Pour un champ multipleRecordLinks (ex. CLUSTER_F) : la liste brute des record IDs liés,
// contrairement à resolve() qui les joindrait en une chaîne de noms — ici on veut comparer
// des IDs, pas les afficher.
function linkedIds(rec, fieldId) {
  const v = cellsOf(rec)[fieldId];
  if (!v) return [];
  return Array.isArray(v) ? v.map(x => (x && typeof x === "object") ? x.id : x) : [];
}

// Handoff Cowork 05.10.2026 : Consolidated view appliquait le même jeu de colonnes à des
// entités ontologiquement différentes (une venture a une verticale, un framework ou une
// app n'en ont pas) — ici le jeu de colonnes par entity_type est explicitement spécifié
// par Cowork plutôt que dérivé des données, parce qu'il inclut des colonnes relationnelles
// calculées (used by, belongs to/division of) qu'aucune dérivation automatique ne peut
// deviner. "All types" ne garde que les 3 colonnes universelles (Name/Nav branch/Status) :

// l'inverse auto-généré d'origine, a été perdu puis remplacé par USES_F recréé cette

}

// Le nom affiché d'un champ vient, par défaut, du nom réel du champ dans Airtable
// (fourni par portfolio.json au sync, via l'API Meta) — pas d'un libellé recopié
// à la main ici. FIELD_META[fid].name n'est une surcharge que quand le site veut
// un mot plus court que le nom Airtable (ex. "contact email" -> "email").
function fieldLabel(fid) {
  const meta = FIELD_META[fid];
  return (meta && meta.name) || FIELD_NAMES[fid] || fid;

// Le statut Airtable est stocké "N/5 — mot" (ex. "2/5 — landing") pour le
// tri/la momentum interne, mais le préfixe numérique n'apporte rien à
// l'affichage — on ne garde que le mot.
function statusText(v) {
  if (!v) return v;
  return v.replace(/^\d\/5\s*—\s*/, "");
}

// Un mot de statut -> sa classe CSS ("Not started" -> "status-not-started"), pour que
// la même palette (voir <style>) s'applique partout où un statut est affiché : la pastille
// de fiche (.status-tag) comme les mini-pastilles pillFor() (.pill).
function statusClass(v) {
  if (!v) return "";
  return "status-" + v.toLowerCase().trim().replace(/\s+/g, "-");
}

// Les choix Airtable de sub-vertical/vertical sont saisis en minuscule ("matchmaking ") ;
// l'ancien champ site section qu'ils remplacent affichait une majuscule à cet endroit.
function capitalize(v) {
  const s = (v || "").trim();
  return s ? s[0].toUpperCase() + s.slice(1) : s;
}

// Une valeur de champ qui EST un lien (URL complète http(s)://... ou domaine nu du type
// "labs.vetnups.com", "clauslabs.ai") se rend comme un vrai <a href> cliquable plutôt que
// comme du texte plat — "le hub renvoie, il ne discute pas". Domaine nu -> on préfixe https://.
// Pour les champs dont la valeur est une URL interne longue (landing/traction/deployment),
// LINK_LABELS donne un texte de lien court plutôt que d'afficher l'URL complète.
const LINK_LABELS = {
  fldu1iQBrGZuKUKuf: "structure",
  fldOLfNxsvfpFS37T: "status",
  fld7d4gZlGVKxqyLO: "metrics",
  fldfYvXdHT9U0RgOx: "doc",
  fld1ayzhTagZyUvPt: "Market Notes",
  fldUbu3d0yxjwGdws: "Deterministic Ventures",
};
function linkify(v, fid) {
  if (!v) return "—";
  const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/i.test(v);
  if (isEmail) return `<a href="mailto:${v}">${v}</a>`;
  const isUrl = /^https?:\/\//i.test(v);
  const isBareDomain = /^([a-z0-9-]+\.)+[a-z]{2,}(\/[^\s]*)?$/i.test(v);
  if (isUrl || isBareDomain) {
    const href = isUrl ? v : `https://${v}`;
    const githubMatch = href.match(/^https?:\/\/github\.com\/([^\/\s]+\/[^\/\s]+?)(?:\.git)?\/?$/i);
    const label = (fid && LINK_LABELS[fid]) || (githubMatch && githubMatch[1]) || v;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  }
  return v;
}

// Un champ FIELD_META marqué {hidden:true, pillFor:"<baseFieldId>"} ne s'affiche jamais
// comme sa propre ligne — sa valeur devient une pastille accolée à la ligne du champ
// qu'il annote (ex. "forum status" -> pastille sur la ligne "forum"). PILL_SOURCES fait
// l'inverse : baseFieldId -> statusFieldId, construit une fois depuis FIELD_META.
const PILL_SOURCES = {};
Object.keys(FIELD_META).forEach(fid => {
  const meta = FIELD_META[fid];
  if (meta.pillFor) PILL_SOURCES[meta.pillFor] = fid;
});
function pillFor(rec, fid) {
  const statusFid = PILL_SOURCES[fid];
  if (!statusFid) return "";
  const status = resolve(rec, statusFid);
  if (!status) return "";
  return `<span class="pill ${statusClass(status)}">${status}</span>`;
}

function renderTable() {
  // Handoff 45 : le champ "site section" a été supprimé côté Airtable (Handoff 44),
  // ce menu déroulant repose maintenant sur entity type — valeurs réellement présentes
  // dans les données, pas la liste figée des choix du schéma Airtable.
  const entityTypes = [...new Set(RECORDS.map(r => resolve(r, ENTITY_TYPE_F)).filter(Boolean))].sort();
  let rows = RECORDS.filter(r => {
    if (filterGroupList) {
      if (!filterGroupList.includes(resolve(r, GROUP_F))) return false;
    } else if (filterSectionList) {
      if (!filterSectionList.includes(resolve(r, SECTION_F))) return false;
    } else if (filterSection !== "*" && resolve(r, ENTITY_TYPE_F) !== filterSection) return false;
    if (searchText) {
      const hay = (resolve(r, NAME_F) + " " + (resolve(r, VERTICAL_F) || "")).toLowerCase();
      if (!hay.includes(searchText.toLowerCase())) return false;
    }
    return true;
  });
  rows.sort((a, b) => {
    const av = resolve(a, sortField) || "", bv = resolve(b, sortField) || "";
    return av.localeCompare(bv) * sortDir;
  });

  // Colonnes par nature (entity_type) : voir ENTITY_TYPE_EXTRA_COLS plus haut. Un lien
  // du site (group=/section=, peut recouvrir plusieurs natures à la fois) n'est pas
  // couvert par ce mapping explicite -> on garde l'élagage par données (une colonne ne
  // s'affiche que si au moins une ligne du sous-ensemble la renseigne) comme filet.
  let cols;
  if (filterGroupList || filterSectionList) {
    cols = CONSOLIDATED_COLS.filter(([f]) => f !== ENTITY_TYPE_F && rows.some(r => resolve(r, f)));
  } else if (filterSection === "*") {

    ${filterLabel ? `<div class="deep-link-banner">Filtered view from the site: <strong>${filterLabel}</strong> · <a href="#" id="clearFilterLink">view full portfolio</a></div>` : ""}
    <div class="filters">

        ${entityTypes.map(s => `<option value="${s}" ${!filterSectionList && !filterGroupList && s===filterSection?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <div class="row-count">${rows.length} ${rows.length>1?"entities":"entity"} shown out of ${RECORDS.length}</div>
    <div class="table-scroll">
    <table class="consolidated">
      <thead><tr>${cols.map(([f,l]) => `<th data-f="${f}" class="${f===sortField?"sorted":""}">${l}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(r => `<tr class="row-clickable" data-id="${r.id}">${cols.map(([f,,computeFn]) => {
          const v = computeFn ? computeFn(r) : resolve(r, f);
          if (f === STATUS_F) return `<td>${v ? statusText(v) : '<span class="empty-cell">—</span>'}</td>`;
          // "business model venture" repliée en "BMV" : seul intitulé assez long pour
          // forcer un retour à la ligne (donc une ligne de tableau sur 3 hauteurs) dans
          // cette colonne, visible uniquement quand elle n'est pas déjà masquée ci-dessus.
          if (f === ENTITY_TYPE_F && (v || "").trim() === "business model venture") return `<td>BMV</td>`;
          return `<td>${v ? v : '<span class="empty-cell">—</span>'}</td>`;
        }).join("")}</tr>`).join("")}
      </tbody>
    </table>
    </div>
  `;
  document.getElementById("searchBox").addEventListener("input", e => { searchText = e.target.value; renderTable(); });
  document.getElementById("sectionFilter").addEventListener("change", e => { filterSectionList = null; filterGroupList = null; filterLabel = null; filterSection = e.target.value; renderTable(); syncUrl(); });
  document.querySelectorAll("table.consolidated th").forEach(th => {
    th.addEventListener("click", () => {
      const f = th.dataset.f;
      if (sortField === f) sortDir *= -1; else { sortField = f; sortDir = 1; }
      renderTable();

      renderAll();
      syncUrl();
    });
  });
}

// fieldIds optionnel : si fourni, on rend EXACTEMENT cette liste de champs, dans cet ordre,
// même absents pour ce record (case "—" grisée) — c'est ce qui garantit l'alignement
// ligne à ligne entre les deux colonnes de la vue Comparer. Sans fieldIds (Fiche individuelle),
// on ne montre que les champs renseignés pour ce record, triés par leur "order" d'onglet.
function renderTabsFor(rec, fieldIds) {
  const ids = fieldIds || Object.keys(cellsOf(rec));
  const byTab = {};
  TAB_ORDER.forEach(t => byTab[t] = []);
  ids.forEach(fid => {
    const meta = FIELD_META[fid];
    if (!meta || !TAB_ORDER.includes(meta.tab) || meta.hidden) return;
    const v = resolve(rec, fid);
    if (fieldIds || v) byTab[meta.tab].push([v, meta.order || 999, fid]);
  });
  TAB_ORDER.forEach(t => byTab[t].sort((a,b) => a[1]-b[1]));
  return TAB_ORDER.filter(t => byTab[t].length).map(t =>
    `<div class="tab-block"><h3>${t}</h3>${byTab[t].map(([v,,fid]) => `<div class="fm-row"><div class="fm-key">${fieldLabel(fid)}</div><div class="${v?"":"empty-cell"}">${linkify(v,fid)}${pillFor(rec,fid)}</div></div>`).join("")}</div>`
  ).join("");
}

// Union des champs renseignés (à gauche OU à droite), triée par onglet puis par "order" —
// c'est cette liste commune, appliquée identiquement aux deux colonnes, qui fait que
// "value prop" tombe toujours sur la même ligne à gauche et à droite, même quand
// l'une des deux entités a des champs que l'autre n'a pas (ex : network scope).
function buildUnionFieldIds(left, right) {
  return Object.keys(FIELD_META)
    .filter(fid => {
      const meta = FIELD_META[fid];
      if (!meta || !TAB_ORDER.includes(meta.tab) || meta.hidden) return false;
      return resolve(left, fid) || resolve(right, fid);
    })
    .sort((a, b) => {
      const ma = FIELD_META[a], mb = FIELD_META[b];
      const ta = TAB_ORDER.indexOf(ma.tab), tb = TAB_ORDER.indexOf(mb.tab);
      if (ta !== tb) return ta - tb;
      return (ma.order || 999) - (mb.order || 999);
    });
}

function renderCompare() {
  if (!compareLeft) compareLeft = (RECORDS.find(r => resolve(r, NAME_F).trim() === "Vetnups") || RECORDS[0]).id;

    .map(r => `<option value="${r.id}">${resolve(r,NAME_F)}</option>`).join("");
  const left = RECORDS.find(r => r.id === compareLeft), right = RECORDS.find(r => r.id === compareRight);
  const unionIds = buildUnionFieldIds(left, right);
  document.getElementById("panelCompare").innerHTML = `
    ${filterLabel ? `<div class="deep-link-banner">Filtered view from the site: <strong>${filterLabel}</strong> · <a href="#" id="clearFilterLink">view full portfolio</a></div>` : ""}

      <div class="venture-col"><h2>${resolve(right,NAME_F)}</h2><div class="sub">${resolve(right,SECTION_F)||"—"} · ${statusText(resolve(right,STATUS_F))||"—"}</div>${renderTabsFor(right, unionIds)}</div>
    </div>
  `;
  document.getElementById("cmpLeft").value = compareLeft;
  document.getElementById("cmpRight").value = compareRight;
  document.getElementById("cmpLeft").addEventListener("change", e => { compareLeft = e.target.value; renderCompare(); });
  document.getElementById("cmpRight").addEventListener("change", e => { compareRight = e.target.value; renderCompare(); });
  const clearLink = document.getElementById("clearFilterLink");
  if (clearLink) clearLink.addEventListener("click", e => { e.preventDefault(); clearDeepLink(); });

// Handoff Cowork 05.10.2026 : un seul record Brand par venture (cadre stratégique).
function brandFor(rec) {
  return BRAND.find(b => linkedIds(b, BRAND_VENTURE_F).includes(rec.id)) || null;
}
// Plusieurs lignes Value Props possibles par venture (une par surface) : on prend celle
// dont surface=landing, et s'il y en a plusieurs (versions R1/R2...), celle au stage le
// plus élevé, ou la plus récente par date_stabilisation en cas d'égalité (handoff).
function landingValueProp(rec) {
  const candidates = VALUE_PROPS.filter(v =>
    linkedIds(v, VP_VENTURE_F).includes(rec.id) &&
    (resolve(v, VP_SURFACE_F) || "").trim().toLowerCase() === "landing"
  );
  if (!candidates.length) return null;
  candidates.sort((a, b) => {
    const stageDiff = (Number(resolve(b, VP_STAGE_F)) || 0) - (Number(resolve(a, VP_STAGE_F)) || 0);
    if (stageDiff) return stageDiff;
    return (resolve(b, VP_DATE_STAB_F) || "").localeCompare(resolve(a, VP_DATE_STAB_F) || "");
  });
  return candidates[0];
}

// Handoff Cowork 05.10.2026 : l'onglet Market (ex-fusionné) mélangeait taxonomie de marché
// et cadre de marque — scindé en deux. "Market" (taxonomie, ci-dessous) : segments,
// corridors, target geographies (Brand/Ventures), puis le reste des champs Market
// génériques déjà gérés par FIELD_META (sub-vertical, vertical, model type, asset type,
// entity type, customer concentration...) MOINS target segments (libellé "target markets"
// trompeur, cf. handoff "correction de libellé" — target geographies le remplace).
function marketTaxonomyRowsHTML(rec, genericMarketRows) {
  const rows = [];
  const brand = brandFor(rec);
  if (brand) {
    [
      [SEGMENT_PRIMARY_F, "segment primary"], [SEGMENT_SECONDARY_F, "segment secondary"],
      [SEGMENT_TERTIARY_F, "segment tertiary"],
      [CORRIDOR_PRIMARY_F, "corridor primary"], [CORRIDOR_INVERSE_F, "corridor inverse"],
      // corridor_origine_contrainte renommé corridor_constrained_origin côté Airtable
      // (addendum 2) — même fldXiwKIhRJWdx3ho, l'ID de champ ne change pas à un renommage.
      [CORRIDOR_ORIGINE_CONTRAINTE_F, "corridor constrained origin"],
    ].forEach(([fid, label]) => {
      const v = resolve(brand, fid);
      if (v) rows.push([label, v]);
    });
  }
  const geographies = resolve(rec, TARGET_GEOGRAPHIES_F);
  if (geographies) rows.push(["target geographies", geographies]);
  const skip = new Set([TARGET_SEGMENTS_F]);
  genericMarketRows.filter(([, , fid]) => !skip.has(fid))
    .forEach(([v, , fid]) => rows.push([fieldLabel(fid), `${linkify(v, fid)}${pillFor(rec, fid)}`]));
  return rows;
}

// "Branding" (ex-partie cadre de marque de l'ancien Market) : value prop (Value Props
// surface=landing, repli sur core value prop de Ventures), pod/rtb_primary (Brand, repli
// sur differentiator de Ventures) — libellés en toutes lettres (POD/RTB illisibles sans
// contexte permanent, addendum 2), les 4 RTB secondaires (verification/interaction/
// monetization/legal, souvent vides selon la venture — normal, pas une erreur de rendu),
// puis anti_positioning. Chaque champ Brand affiché doit rester court et scannable (2
// lignes max, "le plus de champs possible mais propres" — Patrice) ; un contenu plus long
// (target_geography, le détail narratif complet) reste réservé à une future vue de détail,
// jamais compressé de force ni tronqué silencieusement ici.
function brandingRowsHTML(rec, genericBrandingRows) {
  const rows = [];
  const vp = landingValueProp(rec);
  if (vp) {
    const formulation = resolve(vp, VP_FORMULATION_F);
    const badge = [resolve(vp, VP_IDENTIFIANT_F), resolve(vp, VP_STATUT_F)].filter(Boolean).join(" · ");
    rows.push(["value prop (landing)", `${formulation}${badge ? ` <span class="pill">${badge}</span>` : ""}`]);
  } else {
    const cvp = resolve(rec, CORE_VALUE_PROP_F);
    if (cvp) rows.push(["core value prop", cvp]);
  }
  const brand = brandFor(rec);
  const pod = brand && resolve(brand, POD_F);
  if (pod) {
    rows.push(["point of difference", pod]);
  } else {
    const diff = resolve(rec, DIFFERENTIATOR_F);
    if (diff) rows.push(["differentiator", diff]);
  }
  if (brand) {
    [
      [RTB_PRIMARY_F, "reason to believe"],
      [RTB_VERIFICATION_F, "rtb verification"], [RTB_INTERACTION_F, "rtb interaction"],
      [RTB_MONETIZATION_F, "rtb monetization"], [RTB_LEGAL_F, "rtb legal"],
      [ANTI_POSITIONING_F, "anti positioning"],
    ].forEach(([fid, label]) => {
      const v = resolve(brand, fid);
      if (v) rows.push([label, v]);
    });
  }
  const skip = new Set([CORE_VALUE_PROP_F, DIFFERENTIATOR_F]);
  genericBrandingRows.filter(([, , fid]) => !skip.has(fid))
    .forEach(([v, , fid]) => rows.push([fieldLabel(fid), `${linkify(v, fid)}${pillFor(rec, fid)}`]));
  return rows;
}

// Onglet "Value Props" : galerie brute, sans transformation — toutes les lignes liées à la
// venture courante, une par formulation (landing/tagline/bio/investor/welcome...), pas
// seulement la plus aboutie. Patrice veut explicitement voir tous les brouillons.
function valuePropsGalleryHTML(rec) {
  const items = VALUE_PROPS.filter(v => linkedIds(v, VP_VENTURE_F).includes(rec.id))
    .sort((a, b) => (resolve(a, VP_SURFACE_F) || "").localeCompare(resolve(b, VP_SURFACE_F) || "")
      || (resolve(a, VP_IDENTIFIANT_F) || "").localeCompare(resolve(b, VP_IDENTIFIANT_F) || ""));
  if (!items.length) return `<div class="state-msg">No Value Props yet for this venture.</div>`;
  const cols = [
    [VP_SURFACE_F, "Surface"], [VP_IDENTIFIANT_F, "ID"], [VP_FORMULATION_F, "Formulation"],
    [VP_STATUT_F, "Status"], [VP_NOTE_F, "Note"], [VP_STAGE_F, "Stage"], [VP_DATE_STAB_F, "Stabilized"],
  ];
  return `
    <div class="table-scroll">
    <table class="vp-table">
      <thead><tr>${cols.map(([, l]) => `<th>${l}</th>`).join("")}</tr></thead>
      <tbody>
        ${items.map(r => `<tr>${cols.map(([f]) => {
          const v = resolve(r, f);
          return `<td>${v !== null && v !== "" ? v : '<span class="empty-cell">—</span>'}</td>`;
        }).join("")}</tr>`).join("")}
      </tbody>
    </table>
    </div>
  `;
}

function renderSingle() {
  if (!singleSelected) singleSelected = (RECORDS.find(r => resolve(r, NAME_F).trim() === "Vetnups") || RECORDS[0]).id;
  const rec = RECORDS.find(r => r.id === singleSelected);
  const cells = cellsOf(rec);
  const byTab = {};
  TAB_ORDER.forEach(t => byTab[t] = []);
  Object.keys(cells).forEach(fid => {
    const meta = FIELD_META[fid];
    if (!meta || !TAB_ORDER.includes(meta.tab) || meta.hidden) return;
    const v = resolve(rec, fid);
    if (v) byTab[meta.tab].push([v, meta.order || 999, fid]);
  });
  TAB_ORDER.forEach(t => byTab[t].sort((a,b) => a[1]-b[1]));
  // Tous les onglets de TAB_ORDER restent visibles, même sans champ renseigné pour cette venture
  // (ex. Product, encore vide, sert de rappel actif tant qu'aucun champ produit n'a été créé).
  const availableTabs = TAB_ORDER;
  if (!singleTab || !availableTabs.includes(singleTab)) singleTab = availableTabs[0];

  // Handoff 43 : le sélecteur ne propose que les vraies ventures — les composants
  // (iOS, Web App, labs...) polluaient la liste. L'accès direct via ?venture=X reste
  // inchangé, ce filtre ne touche que ce dropdown.
  const options = RECORDS.filter(r => (resolve(r,ENTITY_TYPE_F) || "").toLowerCase() === "business model venture")
    .sort((a,b) => resolve(a,NAME_F).localeCompare(resolve(b,NAME_F)))
    .map(r => `<option value="${r.id}">${resolve(r,NAME_F)}</option>`).join("");

  const singleRows = byTab[singleTab] || [];
  // Market (taxonomie) et Branding (cadre de marque) tirent leur contenu des modules
  // satellites Brand/Value Props (cross-table, pas un simple champ Ventures) : construits
  // à part, voir marketTaxonomyRowsHTML()/brandingRowsHTML(). Value Props est une galerie
  // brute (table HTML, pas des paires label/valeur). Tous les autres onglets gardent le
  // chemin générique FIELD_META.
  const customRows = singleTab === "Market" ? marketTaxonomyRowsHTML(rec, singleRows)
    : singleTab === "Branding" ? brandingRowsHTML(rec, singleRows)
    : null;
  const valuePropsHTML = singleTab === "Value Props" ? valuePropsGalleryHTML(rec) : null;
  // Addendum Cowork 05.10.2026 : l'eyebrow au-dessus du titre affichait un tiret vide pour
  // une venture comme Vetnups (SECTION_F est mort, clusterParentsLink ne concerne que les
  // components). sub-vertical comble ce vide sans dupliquer core value prop/value prop
  // (landing), qui ont leur propre ligne dans l'onglet Branding.
  const metaLine = resolve(rec,SECTION_F) || capitalize(resolve(rec,SUBVERTICAL_F)) || (clusterParentsLink(rec) ? `Component of ${clusterParentsLink(rec)}` : "—");
  const tabBodyHTML = valuePropsHTML
    ? valuePropsHTML
    : customRows
      ? (customRows.length ? customRows.map(([label,html]) => `<div class="fm-row"><div class="fm-key">${label}</div><div>${html}</div></div>`).join("") : `<div class="state-msg">No fields for the ${singleTab} tab yet.</div>`)
      : (singleRows.length ? singleRows.map(([v,,fid]) => `<div class="fm-row"><div class="fm-key">${fieldLabel(fid)}</div><div>${linkify(v,fid)}${pillFor(rec,fid)}</div></div>`).join("") : `<div class="state-msg">No fields for the ${singleTab} tab yet.</div>`);
  document.getElementById("panelSingle").innerHTML = `
    <div class="meta-line">${metaLine}</div>
    <h1 class="vname">${resolve(rec,NAME_F)} <span class="status-tag ${statusClass(statusText(resolve(rec,STATUS_F)))}">${statusText(resolve(rec,STATUS_F)) || "—"}</span></h1>
    <div class="single-tabs">${availableTabs.map(t => `<button data-t="${t}" class="${t===singleTab?"active":""}">${t}</button>`).join("")}</div>
    <div class="tab-block">${tabBodyHTML}</div>
  `;
  document.querySelectorAll(".cluster-parent-link").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      clusterSelected = el.dataset.id;
      currentMode = "cluster";
      setActiveModeButtons();
      renderAll();
      syncUrl();
    });
  });
  const singlePick = document.getElementById("singlePick");
  singlePick.innerHTML = options;
  singlePick.value = singleSelected;
  singlePick.onchange = e => { singleSelected = e.target.value; singleTab = null; renderSingle(); syncUrl(); };
  document.querySelectorAll(".single-tabs button").forEach(b => b.addEventListener("click", () => { singleTab = b.dataset.t; renderSingle(); }));
}

function renderAll() {
  if (currentMode === "table") renderTable();
  if (currentMode === "compare") renderCompare();
  if (currentMode === "single") renderSingle();
  if (currentMode === "cluster") renderCluster();
  if (currentMode === "allclusters") renderAllClusters();
}

function setActiveModeButtons() {
  document.querySelectorAll(".mode-switcher button").forEach(b => b.classList.toggle("active", b.dataset.mode === currentMode));
  document.getElementById("panelTable").style.display = currentMode === "table" ? "" : "none";
  document.getElementById("panelCompare").style.display = currentMode === "compare" ? "" : "none";
  document.getElementById("panelSingle").style.display = currentMode === "single" ? "" : "none";
  document.getElementById("panelCluster").style.display = currentMode === "cluster" ? "" : "none";
  document.getElementById("panelAllClusters").style.display = currentMode === "allclusters" ? "" : "none";
  document.getElementById("singlePickerTop").style.display = currentMode === "single" ? "" : "none";
  document.getElementById("clusterPickerTop").style.display = currentMode === "cluster" ? "" : "none";
}

// Vue de la venture : la venture elle-même + tous les enregistrements dont CLUSTER_F
// pointe vers elle ("composants constitutifs" — forum, blog, lab... doctrine posée en
// session : une venture EST un cluster, pas un objet séparé). Chaque ligne cliquable ->
// bascule directement en vue Fiche individuelle sur CE record précis, sans repasser par
// applyDeepLink() (pas de vue cluster récursive, un seul niveau de profondeur).
// .trim() : le choix Airtable "component" existe avec un espace final en base
// (artefact du champ entity type), sans variante propre — sans ce trim, les
// comparaisons strictes plus bas ne matchaient jamais. Partagée avec clusterRowHTML()
// (Handoff 48) pour détecter les lignes "lab" sans dupliquer la logique.
function entityKind(r) {
  return (resolve(r,ENTITY_TYPE_F) || "").trim().toLowerCase();
}

// Sections dont le header répète déjà la catégorie de chaque ligne (Labs/Content/
// Frameworks/Doctrine) : pour ces lignes, cluster-row-type affiche sub-vertical (ou
// vertical si sub-vertical est vide) au lieu de l'entity type, qui n'apporte rien
// de plus que le header. Sub-vertical d'abord (Patrice, capture Möttrum : "legal
// services" sur narrative constructs ne dit rien que "legal services" lab ne dise
// déjà — "concept licensing", le sub-vertical réel, est l'info qui distingue cette
// ligne des autres labs du même cluster). Apps et Divisions ne sont pas concernées :
// leur badge (platform, ou l'entity type d'une venture en Division) distingue déjà
// chaque ligne.
function showsSpecificAttr(r) {
  const k = entityKind(r);
  return k.includes("lab") || k === "framework" || k === "doctrine" ||
    ["blog","forum","content","review","reviews"].includes(k) || k.includes("content");
}

// Regroupement par nature (Handoff 34) : chaque composant tombe dans la première
// section dont il remplit le critère. "Other" et "Uses" ont été retirées (Handoff 48) :
// les enregistrements qui n'apparaissaient que là disparaissent simplement de la vue.
// Partagé entre renderCluster() (une venture) et renderAllClusters() (Handoff 36,
// toutes les ventures-racines empilées) pour ne pas dupliquer la logique.
function clusterSections(rec, children) {
  const isAppSurface = r => ["app","web app","mobile app","ios app","android app","component"].includes(entityKind(r)) && resolve(r,PLATFORM_F);
  const isLab = r => entityKind(r).includes("lab");
  const isContent = r => ["blog","forum","content","review","reviews"].includes(entityKind(r)) || entityKind(r).includes("content");
  const isFramework = r => entityKind(r) === "framework";
  const isDoctrine = r => entityKind(r) === "doctrine";

  const appSurfaces = children.filter(isAppSurface);
  const labs = children.filter(isLab);
  const content = children.filter(isContent);
  const frameworks = children.filter(isFramework);
  const doctrines = children.filter(isDoctrine);
  // "division of" (fldffBNK8PY9L9zh7) est une relation à part, distincte de belongs
  // to cluster (children) et de uses framework/lab — jamais branchée nulle part avant
  // ce correctif, donc Divisions était en pratique toujours vide (Cohort, Frontier...
  // existaient bien dans la base, juste invisibles ici). Ce sont les records dont
  // DIVISION_OF_F pointe vers rec, pas un sous-ensemble filtré de children.
  const divisions = RECORDS.filter(r => linkedIds(r, DIVISION_OF_F).includes(rec.id));

  return [
    { label: "Divisions", rows: divisions },
    { label: "Apps", rows: appSurfaces },
    { label: "Content", rows: content },
    { label: "Labs", rows: labs },
    { label: "Frameworks", rows: frameworks },
    { label: "Doctrine", rows: doctrines },
  ].filter(s => s.rows.length);
}

// Détail dépliable d'une ligne de composant (Handoff 38) : les mêmes champs/intitulés
// que Consolidated view (CONSOLIDATED_COLS), moins Name/Status déjà dans l'en-tête de
// ligne. "—" pour un champ vide, comme partout ailleurs — rien de masqué.
function clusterRowDetailHTML(r, openByDefault) {
  const fields = CONSOLIDATED_COLS.filter(([f]) => f !== NAME_F && f !== STATUS_F);
  return `
    <div class="cluster-row-detail${openByDefault ? " open" : ""}">
      ${fields.map(([f,l]) => `<div class="fm-row"><div class="fm-key">${l}</div><div>${resolve(r,f) || '<span class="empty-cell">—</span>'}</div></div>`).join("")}
    </div>
  `;
}

// opts.allFields (Cluster view uniquement) : les 17 champs sont affichés directement,
// pas cachés derrière un clic — Patrice ne veut pas 3 champs par ligne dans cette vue,
// il veut pouvoir comparer les champs comme dans Consolidated view. La vue single-venture
// (?venture=X) reste un simple résumé cliquable, inchangée ("il n'y a rien à toucher").
// Même garde pour les pastilles entity type / scope_mode (Handoff 46) : visibles
// uniquement dans l'onglet Cluster view, jamais sur la vue ?venture=X.
// showsSpecificAttr(r) (Labs/Content/Frameworks/Doctrine) : vertical (ou
// sub-vertical) remplace l'entity type répété (même info que le header de
// section) directement dans cluster-row-type, PAS dans une pastille — doctrine
// posée en session : une pastille signale un état ou une action, jamais une
// appartenance/catégorie. D'où aussi l'absence de pastille entity type pour
// ces lignes (ni ici ni en Cluster view) : l'info vit dans cluster-row-type.
// Handoff 50 : même redondance pour les lignes de la section Divisions (liées
// via DIVISION_OF_F, pas showsSpecificAttr — leur entity type reste "business
// model venture" quoi qu'il arrive), mais scope explicite = Venture view
// uniquement (!opts.allFields) ; sub-vertical remplace l'entity type répété,
// rien si vide (pas de "—", contrairement au reste de cette colonne). Même
// redondance non corrigée en Cluster view, hors scope de ce handoff.
function clusterRowHTML(r, rec, opts = {}) {
  const toggleAttr = opts.allFields ? "" : ` data-detail-toggle="${r.id}"`;
  const expandHint = opts.allFields ? "" : '<span class="cluster-row-expand-hint">▾</span>';
  const detail = clusterRowDetailHTML(r, opts.allFields);
  return `
        <div class="cluster-row"${toggleAttr}>
          <div class="cluster-row-main">
            <span class="cluster-row-name" data-nav-id="${r.id}">${resolve(r,NAME_F)}</span>
            ${!showsSpecificAttr(r) && opts.allFields && resolve(r,ENTITY_TYPE_F) ? `<span class="pill">${resolve(r,ENTITY_TYPE_F)}</span>` : ''}
            ${opts.allFields && resolve(r,SCOPE_MODE_F) ? `<span class="pill scope-mode">${resolve(r,SCOPE_MODE_F)}</span>` : ''}
            ${resolve(r,APP_PRIORITY_F) ? `<span class="cluster-row-badge">${resolve(r,APP_PRIORITY_F)}</span>` : ''}
          </div>
          <div class="cluster-row-type">${showsSpecificAttr(r)
            ? (resolve(r,SUBVERTICAL_F) || resolve(r,VERTICAL_F) || "—")
            : (!opts.allFields && linkedIds(r,DIVISION_OF_F).includes(rec.id))
              ? (resolve(r,SUBVERTICAL_F) || "")
              : (opts.allFields ? (resolve(r,PLATFORM_F) || "—") : (resolve(r,PLATFORM_F) || resolve(r,ENTITY_TYPE_F) || "—"))}</div>
          <span class="status-tag ${statusClass(statusText(resolve(r,STATUS_F)))}">${statusText(resolve(r,STATUS_F)) || "—"}</span>
          ${expandHint}
        </div>
        ${detail}
      `;
}

// opts.collapsible (Cluster view uniquement) : le détail démarre replié, un clic sur
// l'en-tête (nom + pastille + compte) l'ouvre/le referme — Patrice voulait un
// "expandable", pas tout déroulé d'un coup comme un cat Unix.
// Handoff Cowork 05.10.2026 : "corps" restauré sur Venture View (!opts.collapsible),
// supprimé par erreur lors du retrait de la section "Core" (56a1d6a) -- Core n'était pas
// qu'un label, c'était la venture elle-même rendue comme ligne cliquable, avec son détail
// complet (CONSOLIDATED_COLS) dépliable via clusterRowDetailHTML. Restauré ici SANS
// redupliquer nom/statut (déjà dans le h1) : un simple toggle "Details" sous le meta-line,
// qui déplie directement clusterRowDetailHTML(rec, false) -- même mécanique que le
// drill-down déjà existant sur les lignes de composants (ex. ouvrir une Division).
// Jamais en Cluster view (opts.collapsible) : le header y bascule déjà tout le bloc.
function clusterBlockHTML(rec, children, opts = {}) {
  const sections = clusterSections(rec, children);
  // Le compte affiché doit correspondre à ce qui est réellement rendu plus bas, pas à
  // children.length : les Divisions (fldffBNK8PY9L9zh7) ne sont PAS un sous-ensemble de
  // children (elles viennent de DIVISION_OF_F, une relation séparée, cf. clusterSections)
  // donc children.length les ignorait — Möttrum affichait "2 composants liés" avec
  // Justisse (division) + 2 labs visibles, soit 3 (Patrice, capture Möttrum). Total des
  // lignes des sections affichées plutôt que children.length.
  const totalRows = sections.reduce((n, s) => n + s.rows.length, 0);
  const toggleAttr = opts.collapsible ? ` data-toggle="${rec.id}"` : "";
  const headerClass = opts.collapsible ? "cluster-block-header compact" : "cluster-block-header";
  return `
    <div class="${headerClass}"${toggleAttr}>
      <div class="cluster-title-row">
        <h1 class="vname">${resolve(rec,NAME_F)} <span class="status-tag ${statusClass(statusText(resolve(rec,STATUS_F)))}">${statusText(resolve(rec,STATUS_F)) || "—"}</span>${opts.allFields && resolve(rec,ENTITY_TYPE_F) ? `<span class="pill">${resolve(rec,ENTITY_TYPE_F)}</span>` : ''}${opts.allFields && resolve(rec,SCOPE_MODE_F) ? `<span class="pill scope-mode">${resolve(rec,SCOPE_MODE_F)}</span>` : ''}</h1>
        <div class="row-count">${totalRows} composant${totalRows===1?"":"s"} lié${totalRows===1?"":"s"}${opts.collapsible ? '<span class="cluster-expand-hint">▾</span>' : ''}</div>
      </div>
      ${(() => {
        // Patrice, capture Venture view sur Claim : le sub-vertical brut ("Small class
        // action") en meta-line sous le h1 sonnait creux, pas assez fort pour un
        // investisseur. core value prop (onglet Market de Single record, déjà écrit
        // comme une vraie phrase, pas une étiquette) est la ligne pertinente quand elle
        // existe ; repli sur le sub-vertical pour les natures qui n'en ont pas (labs,
        // components...) plutôt que de faire disparaître la ligne.
        const line = resolve(rec, CORE_VALUE_PROP_F) || resolve(rec, SUBVERTICAL_F);
        return line ? `<div class="meta-line">${capitalize(line)}</div>` : '';
      })()}
      ${!opts.collapsible ? `<div class="corps-toggle" data-corps-toggle="${rec.id}">Details<span class="cluster-row-expand-hint">▾</span></div>` : ''}
    </div>
    ${!opts.collapsible ? clusterRowDetailHTML(rec, false) : ''}
    <div class="cluster-list${opts.collapsible ? ' collapsed' : ''}">
      ${sections.map(s => `
        <div class="cluster-section-label">${s.label}</div>
        ${s.rows.map(r => clusterRowHTML(r, rec, opts)).join("")}
      `).join("")}
    </div>
  `;
}

// Le nom navigue vers la Fiche individuelle (comportement existant, préservé) ; cliquer
// ailleurs sur la ligne déplie/replie son détail (Handoff 38), même mécanisme que
// attachClusterToggles() pour les en-têtes de venture.
function attachClusterRowInteractions(container) {
  container.querySelectorAll(".cluster-row-name[data-nav-id]").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      singleSelected = el.dataset.navId;
      singleTab = null;
      currentMode = "single";
      setActiveModeButtons();
      renderAll();
      syncUrl();
    });
  });
  container.querySelectorAll(".cluster-row[data-detail-toggle]").forEach(row => {
    row.addEventListener("click", () => {
      const detail = row.nextElementSibling;
      if (!detail || !detail.classList.contains("cluster-row-detail")) return;
      detail.classList.toggle("open");
      row.classList.toggle("expanded");
    });
  });
  // "corps" (Venture view) : le toggle vit dans le header, le détail juste après --
  // header.nextElementSibling, pas row.nextElementSibling comme ci-dessus.
  container.querySelectorAll("[data-corps-toggle]").forEach(toggle => {
    toggle.addEventListener("click", () => {
      const header = toggle.closest(".cluster-block-header");
      const detail = header && header.nextElementSibling;
      if (!detail || !detail.classList.contains("cluster-row-detail")) return;
      detail.classList.toggle("open");
      toggle.classList.toggle("expanded");
    });
  });
}

function attachClusterToggles(container) {
  container.querySelectorAll(".cluster-block-header[data-toggle]").forEach(header => {
    header.addEventListener("click", () => {
      const list = header.nextElementSibling;
      if (!list || !list.classList.contains("cluster-list")) return;
      list.classList.toggle("collapsed");
      header.classList.toggle("expanded");
    });
  });
}

// Onglet "Venture view" : seule façon d'atteindre cette vue (une venture + ses
// composants liés) était un lien profond ?venture=X depuis les pages du site —
// aucun moyen de l'ouvrir depuis portfolio.html lui-même. Le sélecteur ci-dessous
// reprend le même filtre "business model venture" que celui de Single record
// (Handoff 43), et retombe sur la première venture par ordre alphabétique si
// aucune n'est encore sélectionnée (premier clic sur l'onglet, sans ?venture=X).
function renderCluster() {
  const bmvOptions = RECORDS.filter(r => (resolve(r,ENTITY_TYPE_F) || "").toLowerCase() === "business model venture")
    .sort((a,b) => resolve(a,NAME_F).localeCompare(resolve(b,NAME_F)));
  if (!clusterSelected || !RECORDS.some(r => r.id === clusterSelected)) {
    clusterSelected = bmvOptions.length ? bmvOptions[0].id : null;
  }
  const rec = RECORDS.find(r => r.id === clusterSelected);
  const clusterPick = document.getElementById("clusterPick");
  clusterPick.innerHTML = bmvOptions.map(r => `<option value="${r.id}">${resolve(r,NAME_F)}</option>`).join("");
  clusterPick.value = clusterSelected;
  clusterPick.onchange = e => { clusterSelected = e.target.value; renderCluster(); syncUrl(); };
  if (!rec) {
    document.getElementById("panelCluster").innerHTML = `<div class="state-msg">No business model venture found.</div>`;
    return;
  }
  const children = RECORDS.filter(r => linkedIds(r, CLUSTER_F).includes(clusterSelected));
  const panel = document.getElementById("panelCluster");
  panel.innerHTML = clusterBlockHTML(rec, children);
  attachClusterRowInteractions(panel);
}

// Onglet "Cluster view" (Handoff 36, remplace "Compare") : toutes les ventures-racines
// d'un cluster — référencées par au moins un autre record via CLUSTER_F — listées de
// haut en bas, chacune repliée par défaut (juste nom + pastille + compte), un clic sur
// l'en-tête développe son détail (même regroupement que renderCluster()). Pas de
// sélecteur : tout le portfolio d'un coup, mais condensé jusqu'au clic.
function renderAllClusters() {
  const rootIds = new Set();
  RECORDS.forEach(r => linkedIds(r, CLUSTER_F).forEach(id => rootIds.add(id)));
  // Un "Core" est une venture/produit réel, pas un regroupement conceptuel — les
  // frameworks/doctrines pointés via CLUSTER_F (Legal Framework Engineering,
  // Reflexive Law Framework...) n'ont pas de "corps" propre et ne doivent pas
  // apparaître comme leur propre bloc-racine, même si d'autres records les référencent.
  const nonCoreKinds = ["framework", "doctrine", "lab"];
  const roots = RECORDS.filter(r => rootIds.has(r.id) && !nonCoreKinds.includes((resolve(r,ENTITY_TYPE_F) || "").toLowerCase()))
    .sort((a,b) => resolve(a,NAME_F).localeCompare(resolve(b,NAME_F)));
  const panel = document.getElementById("panelAllClusters");
  panel.innerHTML = roots.map(rec => {
    const children = RECORDS.filter(r => linkedIds(r, CLUSTER_F).includes(rec.id));
    return `<div class="cluster-block">${clusterBlockHTML(rec, children, {collapsible: true, allFields: true})}</div>`;
  }).join("");
  attachClusterRowInteractions(panel);
  attachClusterToggles(panel);
}

// Permet aux pages de catégorie du site de renvoyer ici une vue déjà filtrée.
// ?venture=Curb                           — ouvre la vue de la venture (elle + ses composants
//   liés via CLUSTER_F, cf. renderCluster()) ; utilisé par les pages hub pour un lien
//   "nom d'entreprise" -> son cluster. Un clic sur une ligne dans cette vue bascule ensuite
//   en Fiche individuelle sur ce record précis (voir renderCluster()).
// ?group=Tech-Native%20Networks           — filtre sur le champ "portfolio group"
//   (un seul groupe par lien, c'est ce niveau qui correspond 1:1 aux pages du site)
// ?section=Managed%20Marketplaces         — filtre sur "site section" (ancien mécanisme, gardé pour compat)
// ?record=Vetnups                         — ouvre la Fiche individuelle sur ce record précis
//   (écrit par syncUrl(), pas de lien de ce type côté site pour l'instant)
// Si le filtre isole exactement 2 entités, on ouvre directement la vue Comparer.
function applyDeepLink() {
  const params = new URLSearchParams(location.search);
  const ventureParam = params.get("venture");
  if (ventureParam) {
    const rec = RECORDS.find(r => resolve(r, NAME_F).trim() === ventureParam.trim());
    if (rec) {
      clusterSelected = rec.id;
      currentMode = "cluster";
      setActiveModeButtons();
      return;
    }
  }
  // record=X : pendant de ventureParam pour l'onglet Single record (syncUrl()) — ce
  // lien profond n'existait pas avant, Single record n'ayant jamais eu de représentation
  // dans l'URL jusqu'ici.
  const recordParam = params.get("record");
  if (recordParam) {
    const rec = RECORDS.find(r => resolve(r, NAME_F).trim() === recordParam.trim());
    if (rec) {
      singleSelected = rec.id;
      currentMode = "single";
      setActiveModeButtons();
      return;
    }
  }
  // ?entitytype=X : filtre Consolidated view sur un seul entity type (lien "Frame"
  // de la nav, pointe sur les seules "business model venture" au lieu des 41 entrées).
  // Réutilise filterSection (même variable que le <select> de Consolidated view) pour
  // ne pas dupliquer la logique de filtrage de renderTable().
  const entityTypeParam = params.get("entitytype");
  if (entityTypeParam) {
    filterSection = entityTypeParam;
    // Pas de repli sur entityTypeParam : depuis que syncUrl() réécrit entitytype= à
    // chaque navigation interne (pas seulement les liens externes du site), un repli
    // systématique afficherait la bannière "Filtered view from the site" en permanence.
    // La bannière ne doit apparaître que pour un vrai lien externe, qui passe toujours
    // label= explicitement.
    const label = params.get("label");
    if (label) filterLabel = label;
    currentMode = "table";
    setActiveModeButtons();
    return;
  }
  const groupParam = params.get("group");
  const sectionParam = params.get("section");
  let wanted, matches;
  if (groupParam) {
    wanted = groupParam.split(",").map(s => s.trim()).filter(Boolean);
    matches = RECORDS.filter(r => wanted.includes(resolve(r, GROUP_F)));
    if (!matches.length) return;
    filterGroupList = wanted;
  } else if (sectionParam) {
    wanted = sectionParam.split(",").map(s => s.trim()).filter(Boolean);
    matches = RECORDS.filter(r => wanted.includes(resolve(r, SECTION_F)));
    if (!matches.length) return;
    filterSectionList = wanted;
  } else {
    return;
  }
  filterLabel = params.get("label") || wanted.join(" + ");
  if (matches.length === 2) {
    compareLeft = matches[0].id;
    compareRight = matches[1].id;
    currentMode = "compare";
  } else {
    currentMode = "table";
  }
  setActiveModeButtons();
}

function clearDeepLink() {
  filterSectionList = null;
  filterGroupList = null;
  filterLabel = null;
  filterSection = "*";
  renderAll();
  syncUrl();
}

// La navigation interne (onglets, sélecteurs, clics sur une ligne) ne touchait jamais
// l'URL : elle ne vivait qu'en mémoire JS. Un refresh rechargeait donc l'URL d'entrée
// figée dans la barre d'adresse (ex. ?venture=Curb) et la rejouait via applyDeepLink(),
// effaçant toute la navigation faite depuis sans prévenir (Patrice, bug constaté sur
// Single record -> refresh -> retour systématique au lien de départ). On réécrit l'URL
// (replaceState, pas pushState : pas un historique de clic par clic) à chaque changement
// d'onglet/sélection, en réutilisant le vocabulaire de paramètres déjà compris par
// applyDeepLink() (venture=, entitytype=, group=, section=) + un nouveau "record=" pour
// Single record, qui n'avait pas encore de lien profond propre.
function syncUrl() {
  const params = new URLSearchParams();
  if (currentMode === "single" && singleSelected) {
    const rec = RECORDS.find(r => r.id === singleSelected);
    if (rec) params.set("record", resolve(rec, NAME_F));
  } else if (currentMode === "cluster" && clusterSelected) {
    const rec = RECORDS.find(r => r.id === clusterSelected);
    if (rec) params.set("venture", resolve(rec, NAME_F));
  } else if (currentMode === "table" && filterGroupList) {
    params.set("group", filterGroupList.join(","));
    if (filterLabel) params.set("label", filterLabel);
  } else if (currentMode === "table" && filterSectionList) {
    params.set("section", filterSectionList.join(","));
    if (filterLabel) params.set("label", filterLabel);
  } else if (currentMode === "table") {
    // Toujours écrit, "*" (All types) compris : depuis que le filtre par défaut est
    // "business model venture" (retour Patrice), une URL nue ne veut plus dire "All
    // types" mais "pas encore de choix explicite" -> sans ce paramètre, choisir "All
    // types" puis rafraîchir retomberait sur le nouveau défaut au lieu de rester sur
    // "All types". Pas de label ici (pas un lien externe, juste l'état courant) : voir
    // applyDeepLink(), qui ne lève la bannière que si label= est explicitement présent.
    params.set("entitytype", filterSection);
    if (filterLabel) params.set("label", filterLabel);
  }
  const qs = params.toString();
  history.replaceState(null, "", location.pathname + (qs ? `?${qs}` : ""));
}

async function boot() {
  try {
    const res = await fetch("./portfolio.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    FIELD_NAMES = data.fieldNames || {};
    RECORDS = data.records.filter(r => (resolve(r, ROLE_F) || "").trim() !== "benchmark");
    BRAND = data.brand || [];
    VALUE_PROPS = data.valueProps || [];
    applyDeepLink();
    renderAll();
    syncUrl();
  } catch (err) {
    document.getElementById("panelTable").innerHTML = `<div class="state-msg">Unable to load portfolio.json (${err.message}). Check that the file exists next to this page and that the Airtable export has run.</div>`;
  }
}
boot();
</script>
